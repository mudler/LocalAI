- id: "slack"
  name: Slack
  description: "Bind a Slack app to one of your saved agents, so people can talk to it from Slack."
  version: "0.0.0-development"
  channel: "development"
  artifact: "oci://quay.io/go-skynet/local-ai-addons:slack-development"
  mutable: true
  os: "darwin"
  arch: "amd64"
  policy:
    requireSignature: true
    issuer: "https://token.actions.githubusercontent.com"
    identity: "https://github.com/mudler/LocalAI/.github/workflows/addons-package.yml@refs/heads/master"
  ui:
    title: "Slack"
    description: "Bind a Slack app to one of your saved agents, so people can talk to it from Slack."
    mainPage: "apps"
    icon: "ui/icon.png"
    titles:
      "de": "Slack"
      "es": "Slack"
      "fr": "Slack"
      "id": "Slack"
      "it": "Slack"
      "ko": "Slack"
      "pt-BR": "Slack"
      "zh-CN": "Slack"
    descriptions:
      "de": "Verbinden Sie eine Slack-App mit einem Ihrer gespeicherten Agenten, damit andere über Slack mit ihm sprechen können."
      "es": "Vincula una aplicación de Slack a uno de tus agentes guardados para que la gente pueda hablar con él desde Slack."
      "fr": "Associez une application Slack à l'un de vos agents enregistrés pour que les gens puissent lui parler depuis Slack."
      "id": "Hubungkan aplikasi Slack ke salah satu agen tersimpan Anda agar orang dapat mengobrol dengannya dari Slack."
      "it": "Collega un'app Slack a uno dei tuoi agenti salvati, così le persone possono parlarci da Slack."
      "ko": "저장한 에이전트 중 하나에 Slack 앱을 연결하여 사람들이 Slack에서 대화할 수 있게 합니다."
      "pt-BR": "Vincule um app do Slack a um dos seus agentes salvos para que as pessoas possam conversar com ele pelo Slack."
      "zh-CN": "将 Slack 应用绑定到你保存的某个智能体，让大家可以在 Slack 中与它对话。"
