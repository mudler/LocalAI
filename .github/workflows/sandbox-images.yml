---
name: 'sandbox guest image'

# Builds the guest image of the Sandbox add-on for linux/amd64 and linux/arm64
# (addons/sandbox/images/guest/Dockerfile) and pushes it to the project
# registry, the one the other image jobs use (quay.io/go-skynet). The release
# of the add-on stamps the digest into the executable:
#
#   SANDBOX_GUEST_IMAGE=<repository>@sha256:<digest> sh scripts/addons/package.sh ...
#
# This workflow outputs that value as "image" (and the bare "digest"), so a
# caller workflow can run it with `uses:` and pass the output to the package
# legs of the sandbox add-on.
#
# Event policy:
#   pull_request          build both architectures, push nothing, no secrets
#   push to master        build and push, tag sha-<short sha>
#   workflow_dispatch     build and push, tag sha-<short sha>
#   workflow_call         as the event of the caller: build and push, tag
#                         sha-<short sha>, except for a pull request and for a
#                         push to a branch other than master, which push nothing
#
# The repository is quay.io/go-skynet/sandbox-guest unless the repository
# variable SANDBOX_GUEST_REPOSITORY names another one. The repository must
# allow anonymous pulls: the add-on pulls the image on the host that runs it.

on:
  workflow_call:
    outputs:
      image:
        description: 'Reference of the guest image by digest: <repository>@sha256:<digest>'
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: 'Digest of the guest image index'
        value: ${{ jobs.build.outputs.digest }}
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'addons/sandbox/images/guest/**'
      - '.github/workflows/sandbox-images.yml'
  pull_request:
    paths:
      - 'addons/sandbox/images/guest/**'
      - '.github/workflows/sandbox-images.yml'

permissions:
  contents: read

# The group names the workflow that runs: for a workflow_call it is the
# caller, so the run of this file and the run that add-on packages calls for
# the same pull request do not cancel each other.
concurrency:
  group: sandbox-images-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build and push the guest image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      REPOSITORY: ${{ vars.SANDBOX_GUEST_REPOSITORY || 'quay.io/go-skynet/sandbox-guest' }}
      # A caller's push to a branch other than master publishes nothing
      # (scripts/addons/channel.sh), so it pushes no guest image either.
      PUSH: ${{ github.repository == 'mudler/LocalAI' && github.event_name != 'pull_request' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      # The kernel builds on the build machine and cross-compiles. Only the
      # userland stage of the arm64 image needs emulation.
      - uses: docker/setup-qemu-action@master
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@master
      - name: Registry login
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.LOCALAI_REGISTRY_USERNAME }}
          password: ${{ secrets.LOCALAI_REGISTRY_PASSWORD }}
      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./addons/sandbox/images/guest/Dockerfile
          platforms: linux/amd64,linux/arm64
          # No attestation manifests: the add-on reads the index and picks the
          # manifest of its own architecture.
          provenance: false
          sbom: false
          cache-from: type=registry,ref=quay.io/go-skynet/ci-cache:cache-sandbox-guest
          cache-to: ${{ env.PUSH == 'true' && 'type=registry,ref=quay.io/go-skynet/ci-cache:cache-sandbox-guest,mode=max,ignore-error=true' || '' }}
          tags: ${{ env.REPOSITORY }}:sha-${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
      - name: Name the image by digest
        id: ref
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in
          sha256:????????????????????????????????????????????????????????????????) ;;
          *) echo "the build returned no image digest: '$DIGEST'" >&2; exit 1 ;;
          esac
          echo "image=${REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo '### Sandbox guest image'
            echo
            echo "SANDBOX_GUEST_IMAGE=${REPOSITORY}@${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
