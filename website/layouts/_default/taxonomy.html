{{ define "main" }}
<main id="main">
<header class="pagehead"><div class="shell">
  <p class="crumb"><a href="{{ "blog/" | relURL }}">Blog</a> / Tags</p>
  <h1>Every <span class="hl">tag</span>.</h1>
  <p class="lede">Browse the posts by subject.</p>
</div></header>
<section><div class="shell">
  <ul class="tagrow">
    {{ range .Data.Terms.Alphabetical }}<li><a class="chip" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} ({{ .Count }})</a></li>{{ end }}
  </ul>
  <p class="mt-s"><a class="btn btn--o" href="{{ "blog/" | relURL }}">All posts</a></p>
</div></section>
</main>
{{ end }}
