  /api/pii/analyze:
    post:
      description: 'Runs the configured PII detectors (NER and/or pattern tiers) over
        the supplied text and returns the matched entity spans with the policy action
        that would fire. Detection only — the text is not modified and no block is
        enforced. Select detectors explicitly via `detectors`, or pass a consuming
        `model` to use its effective policy: the model''s own `pii.detectors`, else
        the instance-wide `pii_default_detectors`. A model with PII disabled, or enabled
        with nothing to scan with, is a 400. The raw matched value is never returned;
        admins may set `reveal:true` for the audit hash prefix.'
      parameters:
      - description: text + detector selection
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.PIIAnalyzeRequest'
      responses:
        "200":
          description: Detected entities
          schema:
            $ref: '#/definitions/schema.PIIAnalyzeResponse'
      summary: Detect PII entities in a string (no mutation).
      tags:
      - pii
  /api/pii/redact:
    post:
      description: 'Runs the configured PII detectors over the text and applies each
        detector model''s policy: masked spans are replaced with `[REDACTED:<id>]`,
        allow spans pass through, and a single block action causes a 400 (type `pii_blocked`)
        carrying the offending entities — the text is never returned in that case.
        Select detectors via `detectors`, or a consuming `model`''s effective policy
        (its own `pii.detectors`, else the instance-wide `pii_default_detectors`;
        PII must be enabled on the model). Records audit events (origin `pii_redact`)
        visible at /api/pii/events.'
      parameters:
      - description: text + detector selection
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.PIIAnalyzeRequest'
      responses:
        "200":
          description: Redacted text + entities
          schema:
            $ref: '#/definitions/schema.PIIRedactResponse'
      summary: Redact PII in a string by applying the configured policy.
      tags:
      - pii
