# Development builds of the Electron launcher, kept as workflow artifacts
# (not attached to any release, no update feed files):
#
# - push to master: AppImage amd64 and arm64, and the DMG (signed and
#   notarized when the secrets are available), as
#   localai-launcher-dev-linux-amd64, -linux-arm64 and -macos-arm64, kept 14 days.
# - pull request: the amd64 AppImage only, unsigned, no secrets, kept 7 days.
# - manual run: build and smoke for validation, with an optional version.
#   It keeps nothing.
#
# The version is <newest vX.Y.Z tag, patch + 1>-dev.<run number>, and a
# development build never updates itself. See launcher/README.md.
#
# Repository variables (Settings > Variables), both optional:
# - LAUNCHER_DEV_ARM64=false: no arm64 AppImage on master pushes. Each package
#   is about 120 MB; use it when the Actions storage quota is tight.
# - LAUNCHER_DEV_SIGN_MACOS=false: an unsigned dev DMG on master (the
#   fallback when notarization is too slow or queues; testers then allow
#   it once in System Settings, see the macOS install page).
name: Launcher (Electron) dev build

on:
  push:
    branches:
      - master
    paths:
      - 'launcher/**'
      - 'core/http/react-ui/packages/ui-kit/**'
      - 'core/http/react-ui/src/index.css'
      - 'core/http/react-ui/src/theme.css'
      - '.github/workflows/launcher-electron-build.yaml'
      - '.github/workflows/launcher-electron-dev.yaml'
      - '.github/workflows/launcher-electron-release.yaml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'core/http/react-ui/packages/ui-kit/**'
      - 'core/http/react-ui/src/index.css'
      - 'core/http/react-ui/src/theme.css'
      - '.github/workflows/launcher-electron-build.yaml'
      - '.github/workflows/launcher-electron-dev.yaml'
      - '.github/workflows/launcher-electron-release.yaml'
  workflow_dispatch:
    inputs:
      version:
        description: Launcher version (semver). Empty means the development version.
        type: string
        default: ''
      sign-macos:
        description: Sign and notarize the macOS app
        type: boolean
        default: false

# A newer push to the same branch or pull request supersedes the older build
# (master builds included: each one is a complete package). Manual runs are
# never cancelled.
concurrency:
  group: launcher-electron-dev-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}-${{ github.repository }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  version:
    name: Development version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: launcher/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: version
        env:
          GIVEN: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -n "$GIVEN" ]; then
            v=$(node launcher/scripts/version.mjs check "$GIVEN")
          else
            # The tags of the main repository, without a full clone.
            v=$(git ls-remote --tags --refs "$REPO_URL" 'refs/tags/v*' | node launcher/scripts/version.mjs dev "$RUN_NUMBER")
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Launcher version $v"

  # Pull requests: no secrets, read-only token, amd64 AppImage only.
  pull-request:
    name: Pull request build
    if: github.event_name == 'pull_request'
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/launcher-electron-build.yaml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact-prefix: localai-launcher-dev
      linux-arm64: false
      macos: false
      sign-macos: false
      feed: false
      preview-names: false
      upload: true
      retention-days: 7

  master:
    name: Master build
    if: github.event_name == 'push'
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/launcher-electron-build.yaml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact-prefix: localai-launcher-dev
      linux-arm64: ${{ vars.LAUNCHER_DEV_ARM64 != 'false' }}
      macos: true
      sign-macos: ${{ vars.LAUNCHER_DEV_SIGN_MACOS != 'false' }}
      feed: false
      preview-names: false
      upload: true
      retention-days: 14
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  manual:
    name: Manual validation build
    if: github.event_name == 'workflow_dispatch'
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/launcher-electron-build.yaml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact-prefix: localai-launcher-manual
      linux-arm64: true
      macos: true
      sign-macos: ${{ inputs.sign-macos }}
      feed: false
      preview-names: false
      upload: false
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
