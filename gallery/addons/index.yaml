    descriptions:
      "de": "Lassen Sie Ihre Chats und Agenten Ihr Smart Home auslesen und, wenn Sie es erlauben, Lichter und andere Geräte schalten, innerhalb der von Ihnen gesetzten Grenzen."
      "es": "Permite que tus chats y agentes lean tu hogar inteligente y, si lo autorizas, enciendan luces y controlen otros dispositivos, dentro de los límites que establezcas."
      "fr": "Laissez vos conversations et vos agents lire votre maison connectée et, si vous l'autorisez, allumer les lumières et commander d'autres appareils, dans les limites que vous fixez."
      "id": "Izinkan obrolan dan agen Anda membaca rumah pintar Anda dan, jika Anda mengizinkan, menyalakan lampu serta perangkat lain, dengan batas yang Anda tentukan."
      "it": "Lascia che le tue chat e i tuoi agenti leggano la tua casa intelligente e, se lo permetti, accendano le luci e altri dispositivi, entro i limiti che imposti."
      "ko": "채팅과 에이전트가 스마트홈을 읽고, 허용하면 조명 등 기기를 켜고 끌 수 있게 합니다. 한도는 직접 정합니다."
      "pt-BR": "Deixe seus chats e agentes lerem sua casa inteligente e, se você permitir, ligarem luzes e controlarem outros dispositivos, dentro dos limites que você define."
      "zh-CN": "让你的聊天和智能体读取你的智能家居，并在你允许时开关灯光等设备，权限范围由你设定。"
