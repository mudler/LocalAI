---
name: worker dispatch diagnostics (artifacts only)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact diagnostic branch commit SHA reviewed for this run
        required: true
        type: string
permissions:
  contents: read
jobs:
  worker:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diag/worker-dispatch-boundaries'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Require reviewed source identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Offline recovery tests
        run: python3 .github/scripts/test_dispatch_diagnostics_recovery.py
      - name: Recover and build locally
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: bash .github/scripts/dispatch-diagnostics-worker-ci.sh
      - name: Upload bounded diagnostic evidence (not deployment)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-dispatch-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worker-dispatch-artifacts/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
