        type: string
    type: object
  gateway.OperationStatus:
    properties:
      operationId:
        type: string
      requestHash:
        example: 3f786850e387550fdab836ed7e6dc881de23001b3f786850e387550fdab836ed
        type: string
      state:
        description: State is pending, committed, rejected or unknown.
        enum:
        - pending
        - committed
        - rejected
        - unknown
        type: string
      tool:
        description: |-
          Tool and RequestHash name the request the operation ID was first
          used for, as the host recorded it when it dispatched the change (kind
          apply only). They are absent when the host no longer holds the
          request, for example after a restart. Compare RequestHash with the
          hash of your own request before you believe a committed state.
        example: rows-insert
        type: string
    type: object
  gateway.PendingList:
    properties:
      proposals:
        description: |-
          Proposals are the caller's own proposals that still wait for a human
          decision, newest first. A proposal of another user is never listed.
        items:
          $ref: '#/definitions/gateway.Proposal'
        type: array
    type: object
  gateway.Proposal:
    properties:
      action:
        type: string
      addonId:
        type: string
      arguments:
        description: |-
          Arguments are the canonical stored arguments. They are the only
          arguments that can ever be submitted for this proposal.
        type: object
      blocked:
        description: |-
          Blocked reports that another operation on the resource has an
          unresolved outcome, so confirming is denied until it is resolved. The
          operation itself belongs to its proposer and is shown only to the
          resource's owner role, in the unresolved listing and in the denial.
        type: boolean
      createdAt:
        type: string
      digest:
        description: Digest binds a confirmation to exactly what was shown.
        type: string
      effects:
        $ref: '#/definitions/gateway.ProposalEffects'
      expiresAt:
        type: string
      generation:
        type: integer
      id:
        description: |-
          ID is the proposal identifier. It is the operation identifier of the
          stored operation, so a lost reply is always resolved by the same ID.
        type: string
      operationId:
        type: string
      reason:
        description: Reason says why a proposal is cancelled, expired or rejected.
        type: string
      receipt:
        allOf:
        - $ref: '#/definitions/contract.Receipt'
        description: Receipt is present once the runtime answered.
      resolution:
        allOf:
        - $ref: '#/definitions/gateway.ProposalResolution'
        description: |-
          Resolution is present once the resource owner stopped waiting for an
          unresolved outcome. It stays after a late receipt is recorded.
      resourceId:
        type: string
      revision:
        allOf:
        - $ref: '#/definitions/contract.Revision'
        description: |-
          Revision is the schema and data revision the preview saw. The runtime
          refuses the apply when it moved.
      state:
        $ref: '#/definitions/gateway.ProposalState'
    type: object
  gateway.ProposalEffects:
    properties:
      count:
        description: Count is the exact number of effects the operation would have.
        type: integer
      sample:
        description: |-
          Sample is a bounded excerpt of the effects, or the whole preview summary
          when the addon did not separate one.
        type: object
    type: object
  gateway.ProposalList:
    properties:
      proposals:
        items:
          $ref: '#/definitions/gateway.BlockingProposal'
        type: array
    type: object
  gateway.ProposalResolution:
    properties:
