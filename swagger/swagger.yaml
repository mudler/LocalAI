basePath: /
definitions:
  addons.AddonError:
    properties:
      blockedBy:
        description: |-
          BlockedBy is the unresolved operation that blocks the write. It is
          present only with type outcome_blocked, and only for the owner role of
          the resource.
        type: string
      code:
        description: Code repeats the HTTP status. It is absent from outcome_unknown
          responses.
        type: integer
      message:
        description: Message describes the failure and never carries owner details.
        type: string
      operationId:
        description: |-
          OperationID is the original operation, which is the proposal ID for a
          proposal call. It is present only with type outcome_unknown or
          proposal_unavailable.
        type: string
      type:
        description: |-
          Type is addon_error, outcome_unknown when a mutation may have run,
          proposal_unavailable when a proposal call could not be served and the
          same call can be repeated by the same proposal ID after reading it, or
          outcome_blocked (403) when another operation on the resource has an
          unresolved outcome and the caller is the resource's owner role. The
          resource management routes add sharing_disabled (409, local-owner mode
          has no named users to share with), stale (409, the generation or the
          revision the caller saw is out of date), operation_conflict (409, the
          operation ID was used for another request and nothing was applied),
          invalid_request (400, for
          example a missing deletion confirmation or an unsupported operation),
          quota_reached (403) and not_selected (404, no resource is selected for
          the conversation).
        example: outcome_unknown
        type: string
    type: object
  addons.AddonErrorResponse:
    properties:
      error:
        $ref: '#/definitions/addons.AddonError'
    type: object
  addons.ConfirmRequest:
    properties:
      digest:
        description: Digest is the digest of the proposal as it was displayed.
        type: string
    type: object
  addons.RecoveryBackupRequest:
    properties:
      operationId:
        description: |-
          OperationID identifies the request. Repeating it returns the backup it
          made and makes no second one.
        type: string
    type: object
  addons.RecoveryDeleteBackupRequest:
    properties:
      backupId:
        type: string
      operationId:
        type: string
    type: object
  addons.RecoveryDeleted:
    properties:
      deleted:
        type: string
    type: object
  addons.RecoveryPruneRequest:
    properties:
      operationId:
        type: string
    type: object
  addons.RecoveryPruned:
    properties:
      removed:
        items:
          type: string
        type: array
    type: object
  addons.RecoveryPurgeRequest:
    properties:
      confirm:
        description: Confirm is the add-on's ID, typed.
        type: string
      operationId:
        type: string
      scope:
        $ref: '#/definitions/recovery.PurgeScope'
    type: object
  addons.RecoveryRestoreRequest:
    properties:
      backupId:
        type: string
      confirm:
        description: Confirm is the add-on's ID, typed.
        type: string
      mapping:
        additionalProperties:
          type: string
        description: |-
          Mapping names the current account that takes the data of a backup made
          in another ownership mode, as {"local-owner": "<account id>"}. It is
          explicit: there is no wildcard and no default.
        type: object
      operationId:
        type: string
    type: object
  addons.RecoveryVerifyRequest:
    properties:
      backupId:
        type: string
      operationId:
        type: string
    type: object
  addons.ResolveRequest:
    properties:
      digest:
        description: Digest is the digest of the proposal as it was displayed.
        type: string
      reason:
        description: Reason is why the owner stops waiting. Required, at most 512
          characters.
        type: string
    type: object
  addons.UpdateCheckRequest:
    properties:
      operationId:
        description: OperationID identifies the request and is the confirmation header.
        example: check-notes-1
        type: string
    type: object
  addons.UpgradeRequest:
    properties:
      candidateDigest:
        description: CandidateDigest is the digest of the candidate the check resolved.
        example: sha256:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
        type: string
      expectedDigest:
        description: ExpectedDigest is the digest of the installed package the caller
          saw.
        example: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        type: string
      generation:
        description: Generation is the installed generation the caller saw, when it
          knows it.
        example: 1
        type: integer
      operationId:
        description: |-
          OperationID is the identity of the upgrade: repeat it to replay safely
          and, after an outcome_unknown answer, poll operation-status with it. The
          same transition under another operation ID is refused.
        example: upgrade-notes-1
        type: string
    type: object
  apps.AdminView:
    properties:
      canStart:
        type: boolean
      canStop:
        type: boolean
      managementUrl:
        description: ManagementURL opens the management view of the addon.
        example: /app/addons?manage=notes
        type: string
    type: object
  apps.App:
    properties:
      admin:
        allOf:
        - $ref: '#/definitions/apps.AdminView'
        description: Admin is present only for administrators.
      description:
        example: Keep notes.
        type: string
      descriptions:
        additionalProperties:
          type: string
        type: object
      enabled:
        description: |-
          Enabled is the durable desired state. Health is State, a separate
          observation: an enabled app can be failed.
        type: boolean
      generation:
        description: |-
          Generation is the installed generation. A Start or Stop request must
          carry the value that was listed; a stale value is denied.
        example: 3
        type: integer
      hasUI:
        description: HasUI is true when the addon contributes any UI.
        type: boolean
      icon:
        description: |-
          Icon is a same-origin URL of the verified immutable icon of this
          generation. It is absent when the manifest declares none.
        example: /api/addons/apps/notes/icon?generation=3
        type: string
      id:
        description: |-
          ID is the addon identifier and Name its stable machine name. They are
          the same in version one: the receipt records no separate catalog name.
        example: notes
        type: string
      launchMode:
        example: always
        type: string
      mainPage:
        description: |-
          MainPage is the path the Open action navigates to. It is present only
          for an enabled addon whose manifest declares a main page that is one of
          its pages.
        example: /app/addons/notes/home
        type: string
      name:
        example: notes
        type: string
      state:
        description: |-
          State is running, starting, failed or stopped: the observation of the
          process, never an update.
        enum:
        - running
        - starting
        - failed
        - stopped
        example: running
        type: string
      title:
        description: |-
          Title and Description are the default-language text of the manifest.
          Titles and Descriptions carry every language when the manifest
          localizes the text, keyed by BCP 47 tag; they are absent otherwise.
        example: Notes
        type: string
      titles:
        additionalProperties:
          type: string
        type: object
      toolCount:
        type: integer
      toolDefinitions:
        description: |-
          ToolDefinitions are the model-facing definitions the manifest declares:
          the argument schema and the kind of each tool. The host serves them to
          chat from the verified manifest; the add-on process is never asked.
        items:
          $ref: '#/definitions/contract.ToolDefinition'
        type: array
      tools:
        description: |-
          Tools are the tool names of the manifest, at most 32. ToolCount is the
          full number. The manifest carries no tool descriptions.
        items:
          type: string
        type: array
      ui:
        allOf:
        - $ref: '#/definitions/apps.UIView'
        description: |-
          UI describes what the shell loads for this app. It is present only for
          an enabled addon with a UI whose installed package has a sha256 digest.
      update:
        description: |-
          Update is update-pending when the owner's cached update check says an
          update is available for the installed package. It is a separate
          observation from State and is absent otherwise: an unchecked, failed
          or up to date add-on has none. The list never reaches a library.
        enum:
        - update-pending
        example: update-pending
        type: string
      version:
        example: 1.2.3
        type: string
    type: object
  apps.ChatActionView:
    properties:
      component:
        example: SummaryPanel
        type: string
      icon:
        description: |-
          Icon is a host icon name, or the empty string when the action uses the
          packaged icon of the app (see the icon of the app).
        example: sparkles
        type: string
      id:
        description: ID is the manifest identifier of the action.
        example: summarize
        type: string
      label:
        description: |-
          Label is the default-language text; Labels carries every language when
          the manifest localizes it.
        example: Summarize
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      packagedIcon:
        description: PackagedIcon is true when the action draws the packaged app icon.
        type: boolean
      placement:
        description: Placement is composer or message.
        enum:
        - composer
        - message
        example: composer
        type: string
      tool:
        description: |-
          Tool is the own tool the action calls, or Component the exported
          component it opens. Exactly one is set.
        example: summarize
        type: string
    type: object
  apps.List:
    properties:
      apps:
        items:
          $ref: '#/definitions/apps.App'
        type: array
    type: object
  apps.SlotView:
    properties:
      component:
        example: NotesSettings
        type: string
      id:
        example: notes-nav
        type: string
      slot:
        enum:
        - chat.composer.actions
        - chat.message.actions
        - app.nav
        - settings.sections
        example: settings.sections
        type: string
    type: object
  apps.StartRequest:
    properties:
      generation:
        description: Generation is the installed generation the caller saw in the
          list.
        example: 3
        type: integer
      operationId:
        description: |-
          OperationID names the lifecycle operation. Repeating it never runs the
          change twice and, after an outcome_unknown answer, it is the identifier
          to poll.
        example: start-notes-1
        type: string
    type: object
  apps.UIView:
    properties:
      actions:
        description: |-
          Actions are the chat actions that declare a placement and a target.
          Slots and Renderers are the other declared contributions. The manifest
          was validated at install: every tool named here is a tool of the addon,
          every slot is a host slot and every icon is a host icon name or the
          packaged icon. The host draws them only while the addon is enabled and
          usable by the caller.
        items:
          $ref: '#/definitions/apps.ChatActionView'
        type: array
      chatActions:
        items:
          type: string
        type: array
      css:
        description: CSS are the URLs of the declared style sheets.
        items:
          type: string
        type: array
      entry:
        description: |-
          Entry is the URL of the packaged ES module. Every asset URL names the
          package digest, so a new package is a new URL.
        example: /api/addons/notes/assets/0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef/ui.js
        type: string
      navigation:
        items:
          type: string
        type: array
      pages:
        description: |-
          Pages, Navigation and ChatActions are the identifiers the manifest
          declares. The host decides where each one is shown.
        items:
          type: string
        type: array
      renderers:
        items:
          $ref: '#/definitions/contract.Renderer'
        type: array
      sdk:
        allOf:
        - $ref: '#/definitions/contract.VersionRange'
        description: SDK is the range of host SDK versions the module accepts.
      slots:
        items:
          $ref: '#/definitions/apps.SlotView'
        type: array
    type: object
  auth.WebSocketTicketResponse:
    properties:
      expires_at:
        type: string
      ticket:
        type: string
    type: object
  backendlib.Update:
    properties:
      digest:
        type: string
      installedDigest:
        type: string
      installedVersion:
        description: InstalledVersion and InstalledDigest are what metadata.json pins.
        type: string
      name:
        description: Name is the backend name.
        type: string
      signed:
        description: |-
          Signed says the library requires a signature, so the install of the
          update has a verifying step.
        type: boolean
      sourceId:
        description: SourceID is the library the backend came from.
        type: string
      version:
        description: |-
          Version and Digest are the build the library lists now. Version is what
          an install of the update names.
        type: string
    type: object
  builtin.Entry:
    properties:
      adminOnly:
        type: boolean
      feature:
        type: string
      icon:
        type: string
      id:
        type: string
      kind:
        $ref: '#/definitions/builtin.Kind'
      mainPath:
        type: string
      titleKey:
        type: string
    type: object
  builtin.Kind:
    enum:
    - page
    type: string
    x-enum-varnames:
    - KindPage
  catalog.Kind:
    enum:
    - addon
    - backend
    - model
    - all
    type: string
    x-enum-varnames:
    - KindAddon
    - KindBackend
    - KindModel
    - QueryAllKinds
  catalog.RefreshState:
    properties:
      checkedAt:
        type: string
      count:
        type: integer
      failed:
        description: |-
          Failed is true when the latest fetch failed; the previous releases are
          not served in that case.
        type: boolean
      lastSuccess:
        type: string
      skipped:
        description: Skipped and SkippedKinds are as in RefreshResult.
        type: integer
      skippedKinds:
        items:
          type: string
        type: array
    type: object
  catalog.VerificationPolicy:
    properties:
      identity:
        type: string
      identityRegex:
        description: |-
          IdentityRegex is an anchored pattern for the signer identity, used
          instead of Identity so that master and tagged builds both verify. Only a
          library that serves backends may use it; an add-on install refuses it.
        type: string
      issuer:
        type: string
      requireSignature:
        type: boolean
    type: object
  config.Gallery:
    properties:
      artifact_verification:
        allOf:
        - $ref: '#/definitions/config.GalleryVerification'
        description: |-
          ArtifactVerification overrides Verification only for the gallery OCI artifact.
          Backend images keep their separate Verification policy.
      library:
        description: |-
          Library says the URL is a model library (the shared library entry
          shape), not a gallery index.
        type: boolean
      mirrors:
        description: |-
          Mirrors are tried in order when URL cannot be fetched. They are a
          fallback for availability, not a load-balancing pool: the primary is
          always preferred, and a mirror is only consulted after the one before
          it fails. Any URI the gallery loader understands works here
          (https://, github:, file://, oci://).
        items:
          type: string
        type: array
      name:
        type: string
      url:
        type: string
      verification:
        $ref: '#/definitions/config.GalleryVerification'
    type: object
  config.GalleryVerification:
    properties:
      identity:
        type: string
      identity_regex:
        type: string
      issuer:
        type: string
      issuer_regex:
        type: string
      not_before:
        description: NotBefore is an RFC3339 timestamp. Empty disables the time check.
        type: string
      source_repository:
        description: |-
          SourceRepository is an https URL compared exactly against the
          certificate's source-repository extension. Empty skips the check.
        type: string
    type: object
  config.TTSVoice:
    properties:
      gender:
        type: string
      language:
        type: string
      name:
        type: string
    type: object
  contract.OutputDescription:
    properties:
      handle:
        type: string
      mediaType:
        type: string
      name:
        type: string
      size:
        type: integer
    type: object
  contract.Receipt:
    properties:
      operationId:
        type: string
      result:
        $ref: '#/definitions/contract.Result'
      revision:
        $ref: '#/definitions/contract.Revision'
      state:
        $ref: '#/definitions/contract.ReceiptState'
    type: object
  contract.ReceiptState:
    enum:
    - pending
    - committed
    - rejected
    - unknown
    type: string
    x-enum-varnames:
    - ReceiptPending
    - ReceiptCommitted
    - ReceiptRejected
    - ReceiptUnknown
  contract.Renderer:
    properties:
      component:
        type: string
      kind:
        type: string
      tool:
        type: string
    type: object
  contract.Request:
    properties:
      action:
        type: string
      addonId:
        type: string
      arguments:
        type: object
      generation:
        type: integer
      operationId:
        type: string
      resourceId:
        type: string
    type: object
  contract.Result:
    properties:
      outputs:
        items:
          $ref: '#/definitions/contract.OutputDescription'
        type: array
      payload:
        type: object
    type: object
  contract.Revision:
    properties:
      data:
        type: integer
      schema:
        type: integer
    type: object
  contract.ToolDefinition:
    properties:
      description:
        description: Description is plain text for the model.
        type: string
      inputSchema:
        description: |-
          InputSchema is the JSON schema of the arguments object. It is an
          object schema with explicit properties, additionalProperties false at
          the top level and the keywords the host allows only.
        type: object
      kind:
        description: Kind is read, write, schema or create.
        type: string
      name:
        description: Name is one of capabilities.tools.
        type: string
    type: object
  contract.VersionRange:
    properties:
      max:
        type: integer
      min:
        type: integer
    type: object
  failover.ChainState:
    enum:
    - primary
    - fallback
    - degraded
    type: string
    x-enum-varnames:
    - ChainPrimary
    - ChainFallback
    - ChainDegraded
  failover.ChainStatus:
    properties:
      active:
        type: string
      active_since:
        type: string
      name:
        type: string
      pinned:
        type: string
      state:
        $ref: '#/definitions/failover.ChainState'
      targets:
        items:
          $ref: '#/definitions/failover.TargetStatus'
        type: array
    type: object
  failover.Kind:
    enum:
    - local
    - remote
    type: string
    x-enum-varnames:
    - KindLocal
    - KindRemote
  failover.TargetState:
    enum:
    - healthy
    - down
    - recovering
    - missing
    type: string
    x-enum-varnames:
    - StateHealthy
    - StateDown
    - StateRecovering
    - StateMissing
  failover.TargetStatus:
    properties:
      consecutive_ok:
        type: integer
      kind:
        $ref: '#/definitions/failover.Kind'
      last_error:
        type: string
      last_probe:
        type: string
      model:
        type: string
      state:
        $ref: '#/definitions/failover.TargetState'
      warm:
        type: boolean
    type: object
  functions.Function:
    properties:
      description:
        type: string
      name:
        type: string
      parameters:
        additionalProperties: {}
        type: object
      strict:
        type: boolean
    type: object
  functions.Item:
    properties:
      properties:
        additionalProperties: {}
        type: object
      type:
        type: string
    type: object
  functions.JSONFunctionStructure:
    properties:
      $defs:
        additionalProperties: {}
        type: object
      anyOf:
        items:
          $ref: '#/definitions/functions.Item'
        type: array
      oneOf:
        items:
          $ref: '#/definitions/functions.Item'
        type: array
    type: object
  functions.Tool:
    properties:
      function:
        $ref: '#/definitions/functions.Function'
      type:
        type: string
    type: object
  gallery.File:
    properties:
      filename:
        type: string
      sha256:
        type: string
      uri:
        type: string
    type: object
  gallery.GalleryBackend:
    properties:
      alias:
        type: string
      backend:
        description: |-
          Backend is the resolved backend engine for this model (e.g. "llama-cpp").
          Populated at load time from overrides, inline config, or the URL-referenced config file.
        type: string
      capabilities:
        additionalProperties:
          type: string
        type: object
      description:
        type: string
      files:
        description: AdditionalFiles are used to add additional files to the model
        items:
          $ref: '#/definitions/gallery.File'
        type: array
      gallery:
        allOf:
        - $ref: '#/definitions/config.Gallery'
        description: Gallery is a reference to the gallery which contains the model
      icon:
        type: string
      installed:
        description: Installed is used to indicate if the model is installed or not
        type: boolean
      license:
        type: string
      mirrors:
        items:
          type: string
        type: array
      name:
        type: string
      sha256:
        description: |-
          SHA256 is the expected sha256 of the backend tarball at URI / Mirrors.
          Empty disables the integrity check; OCI URIs carry their own digest.
        type: string
      size:
        description: |-
          Size is an optional hardcoded model size string (e.g. "500MB", "14.5GB").
          Used when the size cannot be estimated automatically.
        type: string
      tags:
        items:
          type: string
        type: array
      uri:
        type: string
      url:
        type: string
      urls:
        items:
          type: string
        type: array
      version:
        type: string
    type: object
  gallery.Metadata:
    properties:
      backend:
        description: |-
          Backend is the resolved backend engine for this model (e.g. "llama-cpp").
          Populated at load time from overrides, inline config, or the URL-referenced config file.
        type: string
      description:
        type: string
      files:
        description: AdditionalFiles are used to add additional files to the model
        items:
          $ref: '#/definitions/gallery.File'
        type: array
      gallery:
        allOf:
        - $ref: '#/definitions/config.Gallery'
        description: Gallery is a reference to the gallery which contains the model
      icon:
        type: string
      installed:
        description: Installed is used to indicate if the model is installed or not
        type: boolean
      license:
        type: string
      name:
        type: string
      size:
        description: |-
          Size is an optional hardcoded model size string (e.g. "500MB", "14.5GB").
          Used when the size cannot be estimated automatically.
        type: string
      tags:
        items:
          type: string
        type: array
      url:
        type: string
      urls:
        items:
          type: string
        type: array
    type: object
  gallery.ModelStorage:
    properties:
      files:
        items:
          type: string
        type: array
      missing:
        items:
          type: string
        type: array
      name:
        type: string
      shared_bytes:
        type: integer
      size_bytes:
        type: integer
    type: object
  gallery.NodeDriftInfo:
    properties:
      digest:
        type: string
      node_id:
        type: string
      node_name:
        type: string
      version:
        type: string
    type: object
  gallery.StorageFile:
    properties:
      missing:
        type: boolean
      models:
        items:
          type: string
        type: array
      path:
        description: Path is relative to the models directory.
        type: string
      size_bytes:
        type: integer
    type: object
  gallery.StorageIndex:
    properties:
      errors:
        description: |-
          Errors carries per-config failures (malformed YAML, path escapes),
          reported rather than fatal so one broken config cannot blank the
          whole report.
        items:
          type: string
        type: array
      files:
        items:
          $ref: '#/definitions/gallery.StorageFile'
        type: array
      models:
        items:
          $ref: '#/definitions/gallery.ModelStorage'
        type: array
      total_bytes:
        type: integer
    type: object
  gallery.UpgradeInfo:
    properties:
      available_digest:
        type: string
      available_version:
        type: string
      backend_name:
        type: string
      installed_digest:
        type: string
      installed_version:
        type: string
      node_drift:
        description: |-
          NodeDrift lists nodes whose installed version or digest differs from
          the cluster majority. Non-empty means the cluster has diverged and an
          upgrade will realign it. Empty in single-node mode.
        items:
          $ref: '#/definitions/gallery.NodeDriftInfo'
        type: array
      reason:
        description: |-
          Reason says why the backend is flagged when version and digest alone
          would not flag it: the backend failed a request in a way that shows it
          is older than the server. Empty for ordinary version or digest upgrades.
        type: string
    type: object
  gallery.Variant:
    properties:
      model:
        description: Model is the name of a gallery entry that declares no variants
          of its own.
        type: string
    type: object
  galleryop.NodeProgress:
    properties:
      current:
        type: string
      error:
        type: string
      file_name:
        type: string
      node_id:
        type: string
      node_name:
        type: string
      percentage:
        type: number
      phase:
        type: string
      status:
        type: string
      total:
        type: string
    type: object
  galleryop.OpStatus:
    properties:
      cancellable:
        description: Cancellable is true if the operation can be cancelled
        type: boolean
      cancelled:
        description: Cancelled is true if the operation was cancelled
        type: boolean
      current_bytes:
        type: integer
      deletion:
        description: Deletion is true if the operation is a deletion
        type: boolean
