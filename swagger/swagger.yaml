  /v1/slots/restore:
    post:
      description: Loads the prompt cache that a save call returned an ID for into
        one slot of a llama-cpp model. The ID must have been issued for this model.
        The state is only as fresh as the save. Admin only.
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.SlotCacheRequest'
      responses:
        "200":
          description: Response
          schema:
            $ref: '#/definitions/schema.SlotCacheResponse'
      summary: Restore a slot's prompt cache by ID.
      tags:
      - inference
  /v1/slots/save:
    post:
      description: Writes the prompt cache (KV state) of one slot of a llama-cpp model
        under the directory set by the model's slot_save_path option, and returns
        an ID for it. The server issues the ID; the client cannot choose a name or
        a path. The server keeps at most 32 saves per model and deletes the oldest
        one beyond that. Admin only.
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.SlotCacheRequest'
      responses:
        "200":
          description: Response
          schema:
            $ref: '#/definitions/schema.SlotCacheResponse'
      summary: Save a slot's prompt cache.
      tags:
      - inference
