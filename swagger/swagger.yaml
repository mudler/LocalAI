info:
  contact:
    name: LocalAI
    url: https://localai.io
  description: The LocalAI Rest API.
  license:
    name: MIT
    url: https://raw.githubusercontent.com/mudler/LocalAI/master/LICENSE
  title: LocalAI API
  version: 2.0.0
paths:
  /3d/animate:
    post:
      parameters:
      - description: Named conditioning inputs and model-specific parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.Model3DAnimationRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schema.OpenAIResponse'
      summary: Creates a 3D animation (binary glTF / GLB).
      tags:
      - 3d
  /3d/generations:
    post:
      parameters:
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.Model3DRequest'
      responses:
        "200":
          description: Response
          schema:
            $ref: '#/definitions/schema.OpenAIResponse'
      summary: Creates a 3D asset (binary glTF / GLB) from a conditioning image.
      tags:
      - 3d
  /3d/remesh:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 3D model name
        in: formData
        name: model
        required: true
        type: string
      - description: Source GLB
        in: formData
        name: mesh
        required: true
        type: file
      - description: Detail size as percent of the source bounding-box diagonal (0.35–2.5;
          default 0.5)
        in: formData
        name: detail
        type: number
      produces:
      - model/gltf-binary
      responses:
        "200":
          description: Remeshed GLB
          schema:
            type: file
      summary: Applies watertight print remeshing to an existing 3D asset.
      tags:
      - 3d
  /api/addons/{id}/assets/{digest}/{path}:
    get:
      description: 'Streams one file the addon manifest declares as UI code (the entry
        module or a style sheet) from the verified package on the owner, relayed through
        the receiving frontend. The digest in the path is the sha256 of the installed
        package, in lower-case hex, as listed in the ui entry of the apps list. The
        file is served only while the addon is installed and enabled and the digest
        is the current one; a file the manifest does not declare, a traversal, a directory,
        another addon, an older package, a disabled or uninstalled addon and a missing
        feature all give a denial without any file content, and a denial is never
        cached. The response is text/javascript or text/css with X-Content-Type-Options
        nosniff and Cache-Control private, max-age=31536000, immutable: the URL changes
        with the package, so the file never changes under it. The caller is authenticated
        by an API key header or by the same-origin browser session; a credential in
        the URL is never accepted. The addon process is never asked.'
      parameters:
      - description: Addon ID
        in: path
        name: id
        required: true
        type: string
      - description: Package digest, 64 lower-case hex characters
        in: path
        name: digest
        required: true
        type: string
      - description: Declared package file, for example ui.js
        in: path
        name: path
        required: true
        type: string
      produces:
      - text/javascript
      - text/css
      responses:
        "200":
          description: File bytes
          headers:
            Cache-Control:
              description: private, max-age=31536000, immutable
              type: string
            X-Content-Type-Options:
              description: nosniff
              type: string
          schema:
            type: string
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature denied, or the file, addon or package digest is not
            currently served
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Read an immutable file of an addon UI package
      tags:
      - Addons
  /api/addons/{id}/purge:
    post:
      consumes:
      - application/json
      description: 'Administrators only, from their own browser session, with the
        add-on ID typed as confirm. Removes retained data the scope names: the add-on''s
        data and the owner''s records of its resources and shares (data), its backups
        (backups) and the data copies that restores and failed upgrades set aside
        (recoveryCopies). The add-on must be uninstalled or disabled. It is not the
        deletion of a database and not an uninstall; those never remove retained data.
        The purge is journaled and finished after a crash, and it touches no other
        add-on. No MCP tool maps to this route.'
      parameters:
      - description: Add-on ID
        in: path
        name: id
        required: true
        type: string
      - description: Operation, scope and confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/addons.RecoveryPurgeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: What was purged, with warnings
          schema:
            $ref: '#/definitions/recovery.PurgeReceipt'
        "400":
          description: Malformed request, empty scope or type confirmation_mismatch
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature, administration or browser session denied
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: Type addon_running, operation_conflict or busy
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Unavailable, or outcome_unknown (with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Purge the retained data of an add-on (administrators, browser session)
      tags:
      - Addons
  /api/addons/{id}/recovery:
    get:
      description: Administrators only. Returns the recovery state of the add-on's
        data (ready, upgrading, restoring, needs-recovery or purging) with its reason,
        the backups newest first with their size, creation time, reason (manual, upgrade
        or restore), the ownership mode and package version they hold and the last
        recorded verification result (verified, failed or unverified), the backup
        that is the recovery copy, the receipt and warnings of the last restore, the
        retention policy, the number of data copies a restore set aside and the operation
        IDs whose result is recorded. Read-only. No MCP tool maps to this route.
      parameters:
      - description: Add-on ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Recovery state
          schema:
            $ref: '#/definitions/recovery.Status'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature or administration denied
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Read the data recovery state and the backups of an add-on (administrators)
      tags:
      - Addons
  /api/addons/{id}/recovery/backup:
    post:
      consumes:
      - application/json
      description: Administrators only, from their own browser session (same-origin
        fetch, X-LocalAI-Confirm equal to the operationId). Blocks new admission for
        the add-on's resources, invalidates its pending proposals, drains admitted
        work, stops the add-on, makes a consistent copy of its data (every SQLite
        file with VACUUM INTO, so the write-ahead log is part of it) together with
        the owner's access state, verifies the copy, publishes it atomically with
        restricted permissions and starts the add-on again if it was meant to run.
        A backup that cannot be completed leaves nothing behind. Repeating the operationId
        returns the same backup. 503 insufficient_storage means the free space did
        not fit the backup and nothing was changed. No MCP tool maps to this route.
      parameters:
      - description: Add-on ID
        in: path
        name: id
        required: true
        type: string
      - description: Operation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/addons.RecoveryBackupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The verified backup
          schema:
            $ref: '#/definitions/recovery.BackupReceipt'
        "400":
          description: Malformed request
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature, administration or browser session denied
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "404":
          description: Type not_installed
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: Type busy
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Unavailable, insufficient_storage, or outcome_unknown (with
            operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Back up the data of an add-on (administrators, browser session)
      tags:
      - Addons
  /api/addons/{id}/recovery/delete-backup:
    post:
      consumes:
      - application/json
      description: Administrators only, from their own browser session. The only verified
        copy and the recovery copy of an upgrade are never removed this way (409 sole_recovery_copy);
        a purge with explicit scope removes them. No MCP tool maps to this route.
      parameters:
      - description: Add-on ID
        in: path
        name: id
        required: true
        type: string
      - description: Operation and backup
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/addons.RecoveryDeleteBackupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The deleted backup
          schema:
            $ref: '#/definitions/addons.RecoveryDeleted'
        "400":
          description: Malformed request
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature, administration or browser session denied
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "404":
          description: Type backup_not_found
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: Type sole_recovery_copy or busy
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Unavailable, or outcome_unknown (with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Delete one backup of an add-on (administrators, browser session)
      tags:
      - Addons
  /api/addons/{id}/recovery/prune:
    post:
      consumes:
      - application/json
      description: Administrators only, from their own browser session. Removes the
        backups the configured count and age policy no longer keeps. The newest verified
        backup and the recovery copy of an upgrade stay, whatever their age. No MCP
        tool maps to this route.
      parameters:
      - description: Add-on ID
        in: path
        name: id
        required: true
        type: string
      - description: Operation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/addons.RecoveryPruneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The removed backups
          schema:
            $ref: '#/definitions/addons.RecoveryPruned'
        "400":
          description: Malformed request
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature, administration or browser session denied
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: Type busy
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Unavailable, or outcome_unknown (with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Apply the backup retention policy now (administrators, browser session)
      tags:
      - Addons
  /api/addons/{id}/recovery/restore:
    post:
      consumes:
      - application/json
      description: 'Administrators only, from their own browser session, with the
        add-on ID typed as confirm. The add-on must not be running. The backup is
        verified before anything changes, its files are staged and swapped in atomically,
        and the data they replace stays as a recovery copy until it is purged. Access
        is not restored as it was: every grant is checked again against the current
        accounts and the lowerings of access recorded since the backup, so nobody
        gets back access that was taken away; pending proposals are cancelled and
        operations with an unknown outcome are looked up by receipt and never applied
        again. The answer carries warnings: the time the data goes back to, the number
        of changes made after it that are lost, and the shares that were not restored.
        A backup made in local-owner mode needs mapping {"local-owner": "<account
        id>"}; a backup of named-user data is refused in local-owner mode. Repeating
        the operationId returns the same receipt and does not restore again. No MCP
        tool maps to this route. The backup must belong to the add-on in the path;
        a backup of another add-on is refused with type invalid_request and nothing
        is touched.'
      parameters:
      - description: Add-on ID
        in: path
        name: id
        required: true
        type: string
      - description: Operation, backup, mapping and confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/addons.RecoveryRestoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: What was restored, with warnings
          schema:
            $ref: '#/definitions/recovery.RestoreReceipt'
        "400":
          description: Malformed request, type confirmation_mismatch or mapping_invalid
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature, administration or browser session denied
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "404":
          description: Type backup_not_found
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: Type addon_running, backup_corrupt, incompatible_format, identity_changed,
            mapping_required, downgrade_unsupported, operation_conflict or busy
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Unavailable, or outcome_unknown (with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Restore a backup of an add-on (administrators, browser session)
      tags:
      - Addons
  /api/addons/{id}/recovery/verify:
    post:
      consumes:
      - application/json
      description: Administrators only, from their own browser session. Reads every
        file of the backup against its manifest digests and runs the SQLite integrity
        check, and records the result shown in the list. A failed backup stays in
        place; removing it is a separate explicit action. No MCP tool maps to this
        route.
      parameters:
      - description: Add-on ID
        in: path
        name: id
        required: true
        type: string
      - description: Operation and backup
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/addons.RecoveryVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The verified backup
          schema:
            $ref: '#/definitions/recovery.BackupReceipt'
        "400":
          description: Malformed request
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature, administration or browser session denied
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "404":
          description: Type backup_not_found
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: Type backup_corrupt
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Unavailable, or outcome_unknown (with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Verify a backup of an add-on (administrators, browser session)
      tags:
      - Addons
  /api/addons/{id}/update:
    get:
      description: 'Returns the owner''s update check for an installed add-on, for
        every authenticated caller who holds the addons feature and may see the add-on
        (an administrator any installed add-on, others only an enabled one; anything
        else is the same 403). The status is computed by the owner from the library
        the add-on was installed from and never from the browser: state is unknown,
        up-to-date, update-available, incompatible (with reasons: platform, host-version,
        api-version, protocol-version, sdk-version or data-format), check-failed (with
        a redacted error class and the time the library was last read) or integrity-error.
        A failed check is never up-to-date. A moving channel (development, a branch,
        latest) compares resolved digests, so a changed digest with the same version
        label is an update; an immutable version selects only a greater compatible
        version of the same major. The library and channel never change by themselves.
        The route never uses the network and never applies anything. Callers who are
        not administrators get the state, versions and times only, without library,
        channel or digests. No MCP tool maps to this route.'
      parameters:
      - description: Add-on ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Update status
          schema:
            $ref: '#/definitions/updates.Status'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature denied, or the add-on is unknown or hidden
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Read the update status of an addon
      tags:
      - Addons
  /api/addons/{id}/update/check:
    post:
      consumes:
      - application/json
      description: 'Administrators only, from their own browser session (same-origin
        fetch, X-LocalAI-Confirm equal to the operationId). The owner fetches the
        library the add-on was installed from again, through the credential reference
        the library is configured with, and answers with the new update status. It
        is rate limited per add-on and per library: within the interval the last status
        is returned with throttled true. It applies nothing; an upgrade is a separate
        explicit request. No MCP tool maps to this route.'
      parameters:
      - description: Add-on ID
        in: path
        name: id
        required: true
        type: string
      - description: Operation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/addons.UpdateCheckRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Update status
          schema:
            $ref: '#/definitions/updates.Status'
        "400":
          description: Malformed request
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature, administration or browser session denied
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Check an addon for updates now (administrators, browser session)
      tags:
      - Addons
  /api/addons/{id}/upgrade:
    post:
      consumes:
      - application/json
      description: 'Administrators only, from their own browser session (same-origin
        fetch, X-LocalAI-Confirm equal to the operationId). The only action that applies
        an update. It carries the digest of the installed package the caller saw (expectedDigest)
        and the digest of the candidate the check resolved (candidateDigest). The
        owner re-resolves the library the add-on came from and refuses, before it
        records anything, an installed package that is not the expected one (409 stale_installed),
        a candidate that is not the one it resolves now (409 candidate_changed), an
        incompatible candidate (409 incompatible), a rewritten immutable version (409
        integrity_error) and the same transition under another operation ID (409 upgrade_conflict).
        It never changes the library or the channel. The upgrade then follows the
        lifecycle of an add-on: the candidate is staged and verified, the data is
        backed up and migrated when the add-on has any, and the new generation is
        published only when it starts. A failure or cancellation keeps the last good
        generation or leaves an explicit recovery state; the previous installation
        is never deleted. Repeating the operationId returns the recorded result and
        never runs again; after outcome_unknown read operation-status with the same
        operationId. No MCP tool maps to this route.'
      parameters:
      - description: Add-on ID
        in: path
        name: id
        required: true
        type: string
      - description: Operation and the pinned digests
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/addons.UpgradeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Operation accepted; the payload is the operation status
          schema:
            $ref: '#/definitions/contract.Result'
        "400":
          description: Malformed request
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature, administration or browser session denied
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: Type stale_installed, candidate_changed, incompatible, integrity_error,
            upgrade_conflict, upgrade_failed or operation_conflict
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Unavailable, check_failed, or outcome_unknown (with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Upgrade an addon to the candidate that was checked (administrators,
        browser session)
      tags:
      - Addons
  /api/addons/apps:
    get:
      description: Returns the installed addons that are enabled, for every authenticated
        caller who holds the addons feature. The owner decides what a caller sees;
        hiding an entry is never the control, because every call the entry leads to
        is authorized again. Each app has its title, description, icon URL, version
        and installed generation, a process state (running, starting, failed or stopped;
        the state is an observation, separate from the enabled flag), the path of
        its main page when its manifest declares a valid one, and a bounded tool summary.
        A headless addon is listed without a main page. Administrators additionally
        see installed addons that are disabled and, per app, the start and stop controls
        and the management link. An app carries update update-pending, separate from
        state, only when the owner's cached update check says an update is available
        for the installed package; the list never evaluates a check and never reaches
        a library.
      produces:
      - application/json
      responses:
        "200":
          description: Apps visible to the caller
          schema:
            $ref: '#/definitions/apps.List'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature or owner policy denied the request
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: List the addon apps the caller may use
      tags:
      - Addons
  /api/addons/apps/{id}/icon:
    get:
      description: Streams the immutable icon image of the app at the generation named
        in the query. The image comes from the verified package on the owner, relayed
        through the receiving frontend; it is never served from an addon process and
        never from a URL the manifest names. It is served only for an app the caller
        may see at the generation that was listed. An unknown app, a hidden app, an
        app without a verified icon and a stale generation give the same 403. The
        response is an image with X-Content-Type-Options nosniff and Cache-Control
        private, no-store.
      parameters:
      - description: Addon ID
        in: path
        name: id
        required: true
        type: string
      - description: Installed generation from the apps list
        in: query
        name: generation
        required: true
        type: integer
      produces:
      - image/png
      - image/webp
      - image/jpeg
      responses:
        "200":
          description: Icon bytes
          headers:
            Cache-Control:
              description: private, no-store
              type: string
            X-Content-Type-Options:
              description: nosniff
              type: string
          schema:
            type: string
        "400":
          description: Missing or malformed generation
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature denied, or the app is unknown, hidden, has no icon
            or the generation is stale
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Read the icon of an addon app
      tags:
      - Addons
  /api/addons/apps/{id}/start:
    post:
      consumes:
      - application/json
      description: 'Administrators only. Records the desired state enabled through
        the same lifecycle manager and owner as the typed enable action; the owner
        starts the process and health stays a separate observation. The body carries
        the generation the caller saw in the apps list: a different installed generation
        is denied before anything is recorded. The operationId is the identity of
        the change: repeat it to replay safely, and after an outcome_unknown response
        poll operation-status with it instead of submitting a new operation. Non-administrators
        are denied (403) whatever the body says.'
      parameters:
      - description: Addon ID
        in: path
        name: id
        required: true
        type: string
      - description: Operation and the generation the caller saw
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apps.StartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Operation accepted; the payload is the operation status
          schema:
            $ref: '#/definitions/contract.Result'
        "400":
          description: Malformed body, missing operationId or generation
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature, administration or generation denied the request
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable, or the outcome is unknown
            (type outcome_unknown, with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Start an addon app
      tags:
      - Addons
  /api/addons/apps/{id}/stop:
    post:
      consumes:
      - application/json
      description: 'Administrators only. Records the desired state disabled through
        the same lifecycle manager and owner as the typed disable action; the owner
        drains and stops the process and keeps all data. The body carries the generation
        the caller saw in the apps list: a different installed generation is denied
        before anything is recorded. The operationId is the identity of the change:
        repeat it to replay safely, and after an outcome_unknown response poll operation-status
        with it instead of submitting a new operation. Non-administrators are denied
        (403) whatever the body says.'
      parameters:
      - description: Addon ID
        in: path
        name: id
        required: true
        type: string
      - description: Operation and the generation the caller saw
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apps.StartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Operation accepted; the payload is the operation status
          schema:
            $ref: '#/definitions/contract.Result'
        "400":
          description: Malformed body, missing operationId or generation
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature, administration or generation denied the request
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable, or the outcome is unknown
            (type outcome_unknown, with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Stop an addon app
      tags:
      - Addons
  /api/addons/artifacts/{id}:
    get:
      description: 'Returns the caller''s own artifact: its state (transferring, complete,
        failed or cancelled), the sanitized file name, the media type, the exact size
        and the expiry. Only the principal that requested the result can read it;
        an unknown identifier and another user''s artifact give the same 403, so identifiers
        cannot be probed. The response never carries a storage path or an addon handle.
        This is the status lookup of the background transfer; it is read-only.'
      parameters:
      - description: Artifact ID (host generated, opaque)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Artifact state
          schema:
            $ref: '#/definitions/gateway.Artifact'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature denied, or the artifact is unknown, expired or not
            the caller's
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Read the state of a private addon file result
      tags:
      - Addons
  /api/addons/artifacts/{id}/download:
    get:
      description: Streams the caller's own complete artifact as an attachment, relayed
        through the receiving frontend from the owner that holds the bytes. Access
        needs the session or key of the principal that requested the result and, at
        the start and while streaming, current read access to every source resource
        and a current account. An artifact that is not complete, is expired, belongs
        to another principal or is unknown gives the same 403. The response is always
        an attachment (RFC 6266) with a sanitized name, a media type from a fixed
        allowlist or application/octet-stream, X-Content-Type-Options nosniff and
        Cache-Control private, no-store; it is never rendered inline. A failure after
        the first byte aborts the connection, so a truncated file never looks complete.
        Disabling the addon denies downloads and keeps the bytes until expiry; enabling
        it again serves unexpired artifacts to principals that still have access.
      parameters:
      - description: Artifact ID (host generated, opaque)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      - text/csv
      - application/json
      responses:
        "200":
          description: Artifact bytes
          headers:
            Cache-Control:
              description: private, no-store
              type: string
            Content-Disposition:
              description: attachment with a sanitized filename and filename*
              type: string
            Content-Length:
              description: exact size of the artifact
              type: string
            X-Content-Type-Options:
              description: nosniff
              type: string
          schema:
            type: string
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature denied, or the artifact is unknown, expired, incomplete,
            not the caller's or no longer readable by the caller
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable, or the download bound
            is reached
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Download a private addon file result
      tags:
      - Addons
  /api/addons/builtin:
    get:
      description: 'Returns the page add-ons that ship inside the web bundle. The
        list is empty today: Studio and Talk are packaged add-ons that a person installs
        from the Add-ons drawer. Each entry carries only its own gate: the route needs
        an authenticated caller and no `addons` feature.'
      produces:
      - application/json
      responses:
        "200":
          description: Entries the caller may open
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/builtin.Entry'
              type: array
            type: object
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: List the built-in add-ons the caller may open
      tags:
      - AddonNavigation
  /api/addons/conversations/{conversationId}/selection/{addonId}:
    delete:
      description: Removes the authenticated user's selection for the conversation
        and add-on. Clearing a selection that does not exist succeeds. No MCP tool
        maps to this route.
      parameters:
      - description: Conversation ID
        in: path
        name: conversationId
        required: true
        type: string
      - description: Add-on ID
        in: path
        name: addonId
        required: true
        type: string
      responses:
        "204":
          description: Cleared
        "400":
          description: Malformed conversation or add-on ID
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature denied
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Clear the resource selected for a conversation
      tags:
      - Addons
    get:
      description: 'Returns the resource the authenticated user selected for the conversation
        and add-on, with the user''s current role and display name. The stored reference
        is keyed by the authenticated user, the conversation and the add-on, and is
        never a credential: the owner authorizes it again on every use. A reference
        that was revoked, deleted or never set is one answer: 404 not_selected. Another
        user''s selection of the same conversation ID is never visible. Read-only.
        No MCP tool maps to this route.'
      parameters:
      - description: Conversation ID
        in: path
        name: conversationId
        required: true
        type: string
      - description: Add-on ID
        in: path
        name: addonId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The selection
          schema:
            $ref: '#/definitions/gateway.Selection'
        "400":
          description: Malformed conversation or add-on ID
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature denied
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "404":
          description: Type not_selected
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Read the resource selected for a conversation
      tags:
      - Addons
    put:
      consumes:
      - application/json
      description: Stores which resource the authenticated user chose for the conversation
        and add-on, so that chat tool calls that name no resource use it. The caller
        must hold at least the viewer role on the resource now; the stored reference
        is never a bearer and is authorized again at the owner on every use. It is
        not process-global, not shared between users or conversations, and not part
        of the chat history. The store is bounded per user and expires unused entries.
        No MCP tool maps to this route.
      parameters:
      - description: Conversation ID
        in: path
        name: conversationId
        required: true
        type: string
      - description: Add-on ID
        in: path
        name: addonId
        required: true
        type: string
      - description: The resource
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gateway.SelectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The selection
          schema:
            $ref: '#/definitions/gateway.Selection'
        "400":
          description: Malformed IDs or body
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature denied, or the resource is unknown or not readable
            by the caller
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Select the resource a conversation works on
      tags:
      - Addons
  /api/addons/dispatch:
    post:
      consumes:
      - application/json
      description: 'Authenticates the named caller, checks the addons feature, requires
        administration for every action except read, and forwards the typed request
        to the designated addon owner. A mutation is never retried: after an outcome_unknown
        response keep the operationId and poll operation-status instead of submitting
        a new mutation. Lifecycle actions are install, upgrade, enable, disable and
        uninstall (arguments sourceId and version; enable and disable take the generation
        that was listed). The management reads, all administrator-only and never mutations,
        are catalog-search (arguments text, kind, sourceId, offset, limit up to 100;
        kind is addon by default, or backend, or all), catalog-details (addonId plus
        arguments sourceId and version), catalog-sources and addons-installed. The
        library changes are catalog-source-save (arguments are one source: id, name,
        url, enabled, policy, authReference; removed true deletes it and never touches
        installed addons) and catalog-source-refresh (argument sourceId). A library
        names a credential only by a reference the owner configured, never a secret.
        Unknown argument fields are denied. The update actions are update-status and
        update-check (no arguments; the check fetches the library again and applies
        nothing) and update-upgrade (arguments expectedDigest and candidateDigest,
        the pinned upgrade); each answers with a payload {error: {type, message, status}}
        or {data}, the same from every frontend. The browser pages use the dedicated
        routes under /api/addons/{id}/update and /api/addons/{id}/upgrade, which accept
        only an administrator''s own browser session.'
      parameters:
      - description: Typed addon request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/contract.Request'
      produces:
      - application/json
      responses:
        "200":
          description: Operation accepted or read result
          schema:
            $ref: '#/definitions/contract.Result'
        "400":
          description: 'Malformed or unknown request fields, or type invalid_request
            when the add-on refused the request as invalid: nothing was applied and
            the same call is refused again'
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: 'Feature, administration or owner policy denied the request,
            or type sdk_incompatible when an install is refused because the add-on
            needs another SDK version: the message names the range the add-on needs
            and the SDK version the host provides'
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable, or the outcome of a mutation
            is unknown (type outcome_unknown, with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Submit a typed addon lifecycle operation or read an addon resource
      tags:
      - Addons
  /api/addons/pins:
    get:
      description: 'Returns the ordered add-on IDs the caller pinned to the sidebar.
        The route never pins anything by itself; Studio and Talk are pinned once,
        at upgrade, for the accounts that existed then. The list holds only IDs the
        caller may see right now: a hidden or removed add-on is left out and the route
        does not reveal whether it exists. Needs an authenticated caller and no administrator
        role.'
      produces:
      - application/json
      responses:
        "200":
          description: Ordered add-on IDs
          schema:
            items:
              type: string
            type: array
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: The pin store is unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: List the add-ons the caller pinned
      tags:
      - AddonNavigation
    put:
      consumes:
      - application/json
      description: Replaces the caller's pins with the ordered list in the body. IDs
        the caller may not see are dropped without any hint, and pins that are only
        hidden for now are kept. At most 32 IDs are accepted. Needs an authenticated
        caller from a same-origin browser request or a credential header, and no administrator
        role.
      parameters:
      - description: Ordered add-on IDs
        in: body
        name: pins
        required: true
        schema:
          items:
            type: string
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: The saved list the caller can see
          schema:
            items:
              type: string
            type: array
        "400":
          description: Not a list of strings, or longer than 32
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: The pin store or the add-on owner is unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Replace the add-ons the caller pinned
      tags:
      - AddonNavigation
  /api/addons/proposals:
    get:
      description: 'Returns the caller''s proposals that still wait for a human decision,
        newest first, at most 32, each with its state, exact effect count, bounded
        sample, digest and expiry. This is where a change proposed by a chat tool,
        an agent or a scheduled job waits: only the proposer''s own browser session
        can confirm it. A proposal of another user is never listed, and an expired
        one is left out. Read-only: it applies nothing. API keys may call it so an
        unattended agent can see what is waiting; they still cannot confirm.'
      parameters:
      - description: Only pending is supported
        enum:
        - pending
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: The caller's pending proposals
          schema:
            $ref: '#/definitions/gateway.PendingList'
        "400":
          description: Missing or unsupported state filter
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature denied
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: List the caller's own pending addon proposals
      tags:
      - Addons
    post:
      consumes:
      - application/json
      description: 'A request with action create and no resourceId proposes the creation
        of a resource: the owner reserves a pending resource for the caller that nobody
        can reach, shows the requested name, and creates it only on confirmation by
        the proposer''s browser session. Previews the mutation on the addon owner
        and stores it as a pending proposal with its exact effect count, a bounded
        sample, the revisions it saw and an expiry. Nothing is applied. The operationId
        becomes the proposal ID; repeating the same request returns the same proposal.
        Sharing and database deletion are never proposals. A named session or API
        key with the addons feature may propose; the proposal can only be applied
        by Confirm, which requires the proposer''s own browser session. No MCP tool
        confirms a proposal.'
      parameters:
      - description: Typed write, schema or create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/contract.Request'
      produces:
      - application/json
      responses:
        "200":
          description: Stored proposal
          schema:
            $ref: '#/definitions/gateway.Proposal'
        "400":
          description: 'Malformed or unknown request fields, or type invalid_request
            when the add-on refused the request as invalid: nothing was applied and
            the same call is refused again'
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature, resource policy or request binding denied the proposal.
            Type outcome_blocked (with blockedBy) when the caller is the owner role
            of the resource and another operation on it has an unresolved outcome;
            other callers get the plain denial
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: 'Addons or the owner are unavailable. Type outcome_unknown
            (with operationId): the proposal had been handed to the addon and its
            outcome is unknown, reconcile it. Type proposal_unavailable (with operationId):
            the owner could not serve this call and this call sent nothing to the
            addon; read the proposal for its state, which may already be settled,
            and repeat the same call with the same ID'
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Propose an addon data or schema mutation, or a resource creation, for
        confirmation
      tags:
      - Addons
  /api/addons/proposals/{id}:
    get:
      description: Returns the caller's own proposal with its state, effects, receipt
        and, for a pending proposal that is blocked, the operation to resolve first.
        Expiry is recorded when a pending proposal is read after its expiry.
      parameters:
      - description: Proposal ID (the operation ID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Stored proposal
          schema:
            $ref: '#/definitions/gateway.Proposal'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature denied, or the proposal is not the caller's
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Read a stored addon proposal
      tags:
      - Addons
  /api/addons/proposals/{id}/cancel:
    post:
      description: Withdraws the caller's pending proposal. A cancelled, expired or
        settled proposal can never run. Cancelling needs only a current identity.
      parameters:
      - description: Proposal ID (the operation ID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Cancelled proposal
          schema:
            $ref: '#/definitions/gateway.Proposal'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature denied, the proposal is not the caller's, or it is
            not pending
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: 'Addons or the owner are unavailable. Type outcome_unknown
            (with operationId): the proposal had been handed to the addon and its
            outcome is unknown, reconcile it. Type proposal_unavailable (with operationId):
            the owner could not serve this call and this call sent nothing to the
            addon; read the proposal for its state, which may already be settled,
            and repeat the same call with the same ID'
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Cancel a pending addon proposal
      tags:
      - Addons
  /api/addons/proposals/{id}/confirm:
    post:
      consumes:
      - application/json
      description: 'Applies exactly the stored operation once. This is the only way
        a stored mutation reaches an addon. It is accepted only from the proposer''s
        own browser session: a same-origin fetch from the host UI that carries the
        X-LocalAI-Confirm header equal to the proposal ID and the digest of what was
        shown. API keys, bearer tokens, MCP sessions and requests that carry tool
        or agent execution markers are refused, and no MCP tool maps to this route.
        A repeated confirmation returns the stored receipt. If the reply is lost the
        outcome is outcome_unknown with the original operationId; resolve it with
        reconcile and never submit the change again.'
      parameters:
      - description: Proposal ID (the operation ID)
        in: path
        name: id
        required: true
        type: string
      - description: Digest of the displayed proposal
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/addons.ConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Proposal after the apply, with its receipt
          schema:
            $ref: '#/definitions/gateway.Proposal'
        "400":
          description: 'Malformed or unknown request fields, or type invalid_request
            when the add-on refused the request as invalid: nothing was applied and
            the same call is refused again'
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Not a human confirmation surface, feature denied, or the proposal
            is not pending, is expired, stale, changed or blocked
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: 'Addons or the owner are unavailable. Type outcome_unknown
            (with operationId): the proposal had been handed to the addon and its
            outcome is unknown, reconcile it. Type proposal_unavailable (with operationId):
            the owner could not serve this call and this call sent nothing to the
            addon; read the proposal for its state, which may already be settled,
            and repeat the same call with the same ID'
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Confirm and apply a pending addon proposal
      tags:
      - Addons
  /api/addons/proposals/{id}/reconcile:
    post:
      description: Looks the operation's receipt up on the owner and records a committed
        or rejected result. It never applies anything and can be repeated. Use it
        after an outcome_unknown response. While an outcome is unresolved, other writes
        on the same resource are denied.
      parameters:
      - description: Proposal ID (the operation ID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Proposal after the lookup
          schema:
            $ref: '#/definitions/gateway.Proposal'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature denied or the proposal is not the caller's
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons, the owner or the addon runtime are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Resolve the outcome of an addon proposal by receipt lookup
      tags:
      - Addons
  /api/addons/proposals/{id}/resolve:
    post:
      consumes:
      - application/json
      description: 'Explicit recovery for an operation whose receipt cannot be found.
        After outcome_unknown, repeated reconcile calls and the automatic lookups
        that did not settle it, the owner role of the resource may record that the
        outcome is not worth waiting for. The proposal becomes abandoned-unknown with
        the acting owner, the time and the stated reason, and stops blocking writes
        on the resource. The operation is never submitted again, and a later receipt
        lookup that says it ran is recorded as applied. The owner is asserting that
        waiting is not worth it: a change that did run stays in the data, and the
        revision check of later changes protects against applying on a stale view.
        Accepted only from a host confirmation surface with the same rules as confirm:
        the owner''s own browser session, a same-origin fetch, the X-LocalAI-Confirm
        header equal to the proposal ID, and no tool, agent or MCP marker. Installation
        administrators and API keys have no access through this route, and no MCP
        tool maps to it.'
      parameters:
      - description: Proposal ID (the operation ID)
        in: path
        name: id
        required: true
        type: string
      - description: Digest of the displayed proposal and the reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/addons.ResolveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Proposal after the acknowledgement, or settled by a final receipt
          schema:
            $ref: '#/definitions/gateway.Proposal'
        "400":
          description: 'Malformed or unknown request fields, or type invalid_request
            when the add-on refused the request as invalid: nothing was applied and
            the same call is refused again'
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Not a human confirmation surface, not the resource owner, feature
            denied, digest changed or the proposal is not unresolved
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: 'Addons or the owner are unavailable. Always type proposal_unavailable
            (with operationId), whoever proposed the operation, because resolving
            is not an apply: the owner could not serve this call and it sent nothing
            to the addon; read the proposal for its state and repeat the same call
            with the same ID'
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Abandon an unresolved addon proposal outcome as the resource owner
      tags:
      - Addons
  /api/addons/relay:
    post:
      consumes:
      - application/json
      description: 'Streams the response of the designated addon owner through the
        receiving frontend, bounded per kind by the configured byte and time limits.
        The kind selects the response: status (JSON), progress (text/event-stream),
        json, file (a private file result as an attachment: the handle is the artifact
        ID that a read returned, never an addon handle) or asset (text/javascript
        or text/css). An owner decision made before the first byte is returned with
        the same status from every frontend; a failure after the first byte aborts
        the stream.'
      parameters:
      - description: Relay request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gateway.RelayRequest'
      produces:
      - application/json
      - text/event-stream
      - application/octet-stream
      - text/javascript
      - text/css
      responses:
        "200":
          description: Relayed response body
          schema:
            type: string
        "400":
          description: 'Malformed or unknown request fields, or type invalid_request
            when the add-on refused the request as invalid: nothing was applied and
            the same call is refused again'
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature or owner policy denied the request
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Relay addon status, lifecycle progress, JSON, attachments or immutable
        UI assets
      tags:
      - Addons
  /api/addons/resources:
    get:
      description: 'Returns the resources of one add-on that the caller owns or that
        were shared with the caller, each with the caller''s own role, the display
        name the add-on reported (empty when it could not answer in time), the owner''s
        display name for a shared resource and, for the owner role only, how many
        people it is shared with and the revision to send back with a rename or a
        delete. Resources of other people that are not shared with the caller are
        never listed, whatever the caller''s installation role: installation administration
        is not data access. The answer also carries the installed generation, whether
        sharing is possible (false in local-owner mode) and the management operations
        the add-on supports. At most 100 resources are listed (truncated says more
        exist). Read-only. API keys may call it. No MCP tool maps to this route.'
      parameters:
      - description: Add-on ID
        in: query
        name: addonId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Resources the caller may use
          schema:
            $ref: '#/definitions/gateway.ResourceList'
        "400":
          description: Missing or malformed add-on ID
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Feature denied
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons, the owner or the add-on are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: List the add-on resources the caller may use
      tags:
      - Addons
    post:
      consumes:
      - application/json
      description: 'Creates a resource through the add-on''s create tool as the person''s
        own explicit action, for example a new database. It needs no confirmation
        card: the request is the intent, and the same admission, quota, receipt and
        crash reconciliation rules as every mutation apply. The caller becomes the
        owner and the resource is private. Repeating the same operationId returns
        the same resource and never creates a second one; after outcome_unknown repeat
        the same call. The arguments are validated against the add-on''s own tool
        definition. Accepted only from the person''s own browser session: a same-origin
        fetch whose X-LocalAI-Confirm header equals the operationId, with no API key
        and no tool, agent or MCP marker. No MCP tool maps to this route.'
      parameters:
      - description: Create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gateway.CreateResourceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The created resource
          schema:
            $ref: '#/definitions/gateway.ResourceInfo'
        "400":
          description: Malformed request or arguments the add-on's tool does not accept
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Not a human surface, feature or creation authority denied,
            or type quota_reached
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: 'Type stale: the generation is not the installed one'
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Unavailable, or type outcome_unknown (with operationId) after
            which the same call is repeated
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Create an add-on resource (UI only)
      tags:
      - Addons
  /api/addons/resources/{resourceId}/apply:
    post:
      consumes:
      - application/json
      description: 'Applies one change through a write or schema tool the add-on declares,
        for example inserting rows or adding a column, as the person''s own explicit
        action in the person''s own browser tab. It needs no confirmation card: the
        request is the intent. It is not a proposal and nothing is stored for later.
        The same rules as every change apply: the role of the action (the owner and
        editors write rows, only the owner changes the schema, viewers and installation
        administrators without a grant get the answer of an unknown resource), the
        declared tool definition, the resource''s admission, the generation and the
        revision the caller read (409 stale, nothing changed), the add-on''s receipt,
        which makes repeating the same operationId with the same request one change,
        and a wait behind an unresolved outcome. The tool''s arguments must not name
        the resource, the tool, an actor or any field the tool definition does not
        declare. Reads, creations, the add-on''s rename and delete, administrator
        tools and tools nobody declared are refused with 400. Accepted only from the
        person''s own browser session: a same-origin fetch whose X-LocalAI-Confirm
        header equals the resource ID, with no API key and no tool, agent or MCP marker.
        After outcome_unknown, look the receipt up with kind=apply and the original
        operationId; never submit a new operation. No MCP tool maps to this route.'
      parameters:
      - description: Resource ID
        in: path
        name: resourceId
        required: true
        type: string
      - description: Change request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gateway.ApplyResourceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The committed change and its receipt
          schema:
            $ref: '#/definitions/gateway.ApplyResult'
        "400":
          description: Malformed request, a tool that is not a change, or arguments
            the tool does not accept
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Not a human surface, feature denied, role too low or unknown
            resource, or type outcome_blocked
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: 'Type stale: the generation or the revision moved'
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Unavailable, or type outcome_unknown (with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Change a resource's data or schema by the person's own action (UI only)
      tags:
      - Addons
  /api/addons/resources/{resourceId}/delete:
    post:
      consumes:
      - application/json
      description: 'Permanently deletes the resource, its data and every grant, as
        the owner''s own explicit action. It is never a chat operation and never an
        uninstall. The request must carry the generation and revision the owner listed
        and confirm, which must equal the resource''s display name exactly. The owner
        marks the resource as deleting (inaccessible to everyone, no new admission),
        stops and waits for admitted work, checks the revision, cancels pending proposals,
        asks the add-on to delete and only then removes the record and the grants.
        A crash leaves a deleting record that the owner finishes at startup; an unconfirmed
        one returns to use. A 503 with type outcome_unknown means the deletion is
        confirmed and being finished: repeat the same call, the resource is inaccessible
        meanwhile. Accepted only from the owner''s own browser session (same-origin
        fetch, X-LocalAI-Confirm equal to the resource ID). No MCP tool maps to this
        route and the add-on''s delete tool is not offered to any model.'
      parameters:
      - description: Resource ID
        in: path
        name: resourceId
        required: true
        type: string
      - description: Delete request with the typed confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gateway.DeleteResourceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Deleted
          schema:
            $ref: '#/definitions/gateway.DeleteResult'
        "400":
          description: Malformed request, wrong confirmation or unsupported operation
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Not a human surface, feature denied, not the owner role or
            unknown resource, or type outcome_blocked
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: Type stale
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Unavailable, or type outcome_unknown (with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Delete a resource and its data (owner, UI only)
      tags:
      - Addons
  /api/addons/resources/{resourceId}/grants:
    get:
      description: 'Returns the grants of the whole resource: the immutable account
        ID, the display name and the role of each grantee. Only the owner role of
        the resource may read it; installation administrators, editors and viewers
        get the same denial as for an unknown resource. Local-owner mode has no sharing
        and answers 409 sharing_disabled. Accepted only from the owner''s own browser
        session (same-origin fetch, X-LocalAI-Confirm equal to the resource ID). No
        MCP tool maps to this route.'
      parameters:
      - description: Resource ID
        in: path
        name: resourceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Grants of the resource
          schema:
            $ref: '#/definitions/gateway.GrantList'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Not a human surface, feature denied, not the owner role or
            unknown resource
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: Type sharing_disabled
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: List who a resource is shared with (owner, UI only)
      tags:
      - Addons
  /api/addons/resources/{resourceId}/grants/{userId}:
    delete:
      description: Removes the user's grant. It returns only after the user's admitted
        work stopped and their pending proposals were cancelled; a drain that did
        not finish in the bound is a 503 and the revocation is already effective for
        new work. Local-owner mode answers 409 sharing_disabled. Accepted only from
        the owner's own browser session (same-origin fetch, X-LocalAI-Confirm equal
        to the resource ID). Safe to repeat. No MCP tool maps to this route.
      parameters:
      - description: Resource ID
        in: path
        name: resourceId
        required: true
        type: string
      - description: Account ID of the grantee
        in: path
        name: userId
        required: true
        type: string
      - description: Optional operation ID, returned with outcome_unknown
        in: query
        name: operationId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Grants after the change
          schema:
            $ref: '#/definitions/gateway.GrantList'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Not a human surface, feature denied, not the owner role or
            unknown resource
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: Type sharing_disabled
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Unavailable, or type outcome_unknown (with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Stop sharing a resource with a user (owner, UI only)
      tags:
      - Addons
    put:
      consumes:
      - application/json
      description: 'Gives the user the viewer or editor role on the whole resource;
        there are no per-table grants and the owner role cannot be granted. The user
        is named by the immutable account ID the user picker returned, and must be
        an active named account that may use add-ons. Lowering a role stops the user''s
        admitted work and cancels the user''s pending proposals before it is acknowledged.
        Local-owner mode answers 409 sharing_disabled. Accepted only from the owner''s
        own browser session (same-origin fetch, X-LocalAI-Confirm equal to the resource
        ID). Safe to repeat; after outcome_unknown repeat the same call. No MCP tool
        maps to this route: sharing is never a tool.'
      parameters:
      - description: Resource ID
        in: path
        name: resourceId
        required: true
        type: string
      - description: Account ID of the grantee
        in: path
        name: userId
        required: true
        type: string
      - description: Role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gateway.SetGrantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Grants after the change
          schema:
            $ref: '#/definitions/gateway.GrantList'
        "400":
          description: Malformed body or role
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Not a human surface, feature denied, not the owner role, unknown
            resource or a user that cannot be granted
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: Type sharing_disabled
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Unavailable, or type outcome_unknown (with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Share a whole resource with a named user (owner, UI only)
      tags:
      - Addons
  /api/addons/resources/{resourceId}/operations/{operationId}:
    get:
      description: Read-only receipt lookup after an outcome_unknown answer. kind
        is rename (operationId is the one the rename carried), delete or apply (the
        operationId of a change; any role that may write looks up its own). The state
        is pending, committed, rejected or unknown; it never applies anything. The
        owner role may look up a rename or a deletion and the roles that may write
        look up their own changes, from the owner's own browser session (same-origin
        fetch, X-LocalAI-Confirm equal to the resource ID). After a deletion finished
        the resource is gone and the lookup is denied like any unknown resource. No
        MCP tool maps to this route.
      parameters:
      - description: Resource ID
        in: path
        name: resourceId
        required: true
        type: string
      - description: Operation ID of the rename
        in: path
        name: operationId
        required: true
        type: string
      - description: Operation kind
        enum:
        - rename
        - delete
        - apply
        in: query
        name: kind
        required: true
        type: string
      - description: 'Apply only: the requestHash of the request the caller means
          (64 lowercase hex). A lookup whose hash is not the one the operation ID
          was used for is a 409 operation_conflict, never the other request''s receipt'
        in: query
        name: requestHash
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Receipt state
          schema:
            $ref: '#/definitions/gateway.OperationStatus'
        "400":
          description: Unsupported kind or malformed requestHash
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Not a human surface, feature denied, not the owner role or
            unknown resource
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: 'Type operation_conflict: the operation ID belongs to another
            request'
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons, the owner or the add-on are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Look up the receipt of a rename or a deletion (owner, UI only)
      tags:
      - Addons
  /api/addons/resources/{resourceId}/proposals:
    get:
      description: 'Returns the proposals on the resource whose outcome is unresolved
        (executing, outcome-unknown) or abandoned-unknown, whoever proposed them,
        so the resource owner can learn the operation ID and digest that resolve needs.
        Each entry has the proposal ID, state, the proposing user, the action, the
        exact effect count and the bounded effect sample the proposer saw, the expiry,
        the digest and the age in seconds. It never returns the proposed arguments
        or any credential. Read-only. Only the owner role of the resource may call
        it; installation administrators, editors and viewers are denied. It is accepted
        only from a host confirmation surface with the rules of resolve: the owner''s
        own browser session, a same-origin fetch, the X-LocalAI-Confirm header equal
        to the resource ID, and no tool, agent or MCP marker. API keys are refused
        and no MCP tool maps to this route.'
      parameters:
      - description: Resource ID
        in: path
        name: resourceId
        required: true
        type: string
      - description: Only unresolved is supported
        enum:
        - unresolved
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Unresolved proposals, oldest first
          schema:
            $ref: '#/definitions/gateway.ProposalList'
        "400":
          description: Missing or unsupported state filter
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Not a human confirmation surface, not the owner role of the
            resource, feature denied or unknown resource
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: List the unresolved addon proposals of a resource as its owner
      tags:
      - Addons
  /api/addons/resources/{resourceId}/rename:
    post:
      consumes:
      - application/json
      description: Renames the resource through the add-on as the owner's own explicit
        action, with no confirmation card. It still runs under the resource's admission,
        waits behind an unresolved outcome (403 outcome_blocked for the owner role),
        is checked against the generation and the revision the owner listed (409 stale,
        nothing changed) and leaves the add-on's receipt for the operation. Repeating
        the same operationId never renames twice; after outcome_unknown repeat the
        same call or look it up with the operation status route. Accepted only from
        the owner's own browser session (same-origin fetch, X-LocalAI-Confirm equal
        to the resource ID). No MCP tool maps to this route.
      parameters:
      - description: Resource ID
        in: path
        name: resourceId
        required: true
        type: string
      - description: Rename request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gateway.RenameResourceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The renamed resource
          schema:
            $ref: '#/definitions/gateway.ResourceInfo'
        "400":
          description: Malformed request or a name the add-on refuses
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Not a human surface, feature denied, not the owner role or
            unknown resource, or type outcome_blocked
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: Type stale
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Unavailable, or type outcome_unknown (with operationId)
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Rename a resource (owner, UI only)
      tags:
      - Addons
  /api/addons/resources/{resourceId}/users:
    get:
      description: Finds active named accounts that may use add-ons by a prefix of
        the display name or of the address, 2 to 64 characters, at most 20 results.
        Each result is an immutable account ID and a display name and nothing else.
        Only the owner role of the resource may search; the owner and the caller are
        left out. Local-owner mode answers 409 sharing_disabled. Accepted only from
        the owner's own browser session (same-origin fetch, X-LocalAI-Confirm equal
        to the resource ID). No MCP tool maps to this route.
      parameters:
      - description: Resource ID
        in: path
        name: resourceId
        required: true
        type: string
      - description: Name or address prefix
        in: query
        name: q
        required: true
        type: string
      - description: At most this many results, up to 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Matching people
          schema:
            $ref: '#/definitions/gateway.UserList'
        "400":
          description: Query too short or too long
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "401":
          description: Named authentication required
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "403":
          description: Not a human surface, feature denied, not the owner role or
            unknown resource
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "409":
          description: Type sharing_disabled
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
        "503":
          description: Addons or the owner are unavailable
          schema:
            $ref: '#/definitions/addons.AddonErrorResponse'
      summary: Search the people a resource can be shared with (owner, UI only)
      tags:
      - Addons
