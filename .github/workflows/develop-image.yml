name: 'build and push develop image'

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: develop-image-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'rossigee/LocalAI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/rossigee/localai:develop
            ghcr.io/rossigee/localai:develop-${{ github.sha }}
            ghcr.io/rossigee/localai:latest
          build-args: |
            BUILD_TYPE=
