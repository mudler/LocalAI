        type: string
      file_name:
        type: string
      file_size:
        type: string
      gallery_element_name:
        type: string
      message:
        type: string
      nodes:
        description: |-
          Nodes is the per-node breakdown for a fanned-out backend install.
          Populated by DistributedBackendManager (per-node terminal status)
          and by the Phase 2 progress bridge (per-byte ticks). The
          /api/operations handler surfaces this so the UI can render an
          expandable per-node view of an in-flight install.
        items:
          $ref: '#/definitions/galleryop.NodeProgress'
        type: array
      phase:
        type: string
      processed:
        type: boolean
      progress:
        type: number
      total_bytes:
        type: integer
    type: object
  gateway.ApplyResourceRequest:
    properties:
      arguments:
        description: |-
          Arguments are the tool's own arguments without the resource, which the
          path names, and without the tool, which Tool names.
        type: object
      generation:
        description: Generation is the installed generation the caller listed.
        example: 3
        type: integer
      operationId:
        description: |-
          OperationID names the change. Repeating it with the same request
          returns the same receipt and never applies twice; after an
          outcome_unknown answer it is what to repeat.
        example: apply-1
        type: string
      revision:
        allOf:
        - $ref: '#/definitions/contract.Revision'
        description: |-
          Revision is the revision the caller read. A moved revision is a stale
          denial and nothing is changed.
      tool:
        description: Tool is a write or schema tool the add-on declares.
        example: rows-insert
        type: string
    type: object
  gateway.ApplyResult:
    properties:
      operationId:
        type: string
      requestHash:
        description: |-
          RequestHash binds the operation ID to the request: the SHA-256 of the
          resource, the tool and the canonical arguments. A lookup of the
          operation reports it, so a client can tell its own request from
          another one that used the same ID.
        example: 3f786850e387550fdab836ed7e6dc881de23001b3f786850e387550fdab836ed
        type: string
      resourceId:
        type: string
      result:
        description: |-
          Result is what the add-on's receipt reported, for example the count
          and the identifiers of the changed rows.
        type: object
      revision:
        allOf:
        - $ref: '#/definitions/contract.Revision'
        description: Revision is the revision after the change.
    type: object
  gateway.Artifact:
    properties:
      addonId:
        description: AddonID and Generation name the addon build that produced the
          result.
        type: string
      createdAt:
        type: string
      expiresAt:
        description: ExpiresAt is when the artifact stops being served and is removed.
        type: string
      generation:
        type: integer
      id:
        description: |-
          ID is the host-generated opaque identifier. It is the only handle a
          client ever holds for the file.
        type: string
      mediaType:
        type: string
      name:
        description: |-
          Name is the sanitized attachment name and MediaType the safe media type
          the download is served with.
        type: string
      operationId:
        description: OperationID is the operation of the request that produced the
          output.
        type: string
      principal:
        description: |-
          Principal is the user who requested the result. Only this user can read
          or download the artifact.
        type: string
      reason:
        description: |-
          Reason says why a transfer failed or was cancelled. It never carries
          addon text.
        type: string
      size:
        description: Size is the exact number of bytes of a complete artifact.
        type: integer
      sources:
        description: |-
          Sources are the resources the bytes were produced from. Every one of
          them must still be readable by the principal at completion and at each
          download.
        items:
          $ref: '#/definitions/gateway.ArtifactResource'
        type: array
      state:
        $ref: '#/definitions/gateway.ArtifactState'
    type: object
  gateway.ArtifactResource:
    properties:
      addonId:
        type: string
      resourceId:
        type: string
    type: object
  gateway.ArtifactState:
    enum:
    - transferring
    - complete
    - failed
    - cancelled
    type: string
    x-enum-varnames:
    - ArtifactTransferring
    - ArtifactComplete
    - ArtifactFailed
    - ArtifactCancelled
  gateway.BlockingProposal:
    properties:
      action:
        type: string
      addonId:
        type: string
      ageSeconds:
        description: |-
          AgeSeconds is how long the outcome has been unresolved, counted from
          the hand-over to the addon.
        type: integer
      createdAt:
        type: string
      digest:
        description: Digest is what the owner names to resolve the proposal.
        type: string
      effects:
        $ref: '#/definitions/gateway.ProposalEffects'
      expiresAt:
        type: string
      id:
        description: ID is the proposal identifier, which is its operation identifier.
        type: string
      proposerId:
        description: ProposerID is the user who proposed the operation.
        type: string
      reason:
        description: Reason says why the outcome is unresolved.
        type: string
      resolution:
        allOf:
        - $ref: '#/definitions/gateway.ProposalResolution'
        description: Resolution is present once the owner stopped waiting.
      resourceId:
        type: string
      state:
        allOf:
        - $ref: '#/definitions/gateway.ProposalState'
        description: State is executing, outcome-unknown or abandoned-unknown.
