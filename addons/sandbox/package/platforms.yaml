# Release platform matrix of the Sandbox add-on package.
#
# The sandbox runs code in gVisor or in a Cloud Hypervisor guest on Linux, and
# in a Virtualization.framework guest on macOS with Apple silicon. The macOS
# package carries no runtime file: package.sh signs its executable with the
# virtualization entitlement (package/entitlements.plist), and
# fetch-runtime.sh fetches nothing for it. darwin/arm64 is enabled: its leg
# builds, signs and checks the executable natively on a macOS runner, where
# package.sh signs with codesign. darwin/amd64 never gets a guest, because the
# backend needs Apple silicon, so it stays disabled.
# None of the backends runs on Windows itself (gVisor, Cloud Hypervisor with
# KVM and Virtualization.framework do not exist there, and the unsafe host
# backend needs a POSIX shell and process groups). The windows/amd64 package
# runs the Linux add-on in WSL 2 instead ("execution: wsl2" on the row; the
# packager writes it to the manifest as osSettings.windows.execution): it carries
# the linux/amd64 executable and runtime files, and package.sh builds it on a
# linux/amd64 host. Its native check starts the executable through wsl.exe,
# so it needs a Windows runner with WSL. It stays disabled until such a runner
# shows the check passing.
# The Linux packages carry the runsc of package/runsc.json, the gvisor-profile tool, and
# the Cloud Hypervisor and virtiofsd of package/kvm.json (virtiofsd on amd64
# only: upstream publishes no static arm64 build). fetch-runtime.sh puts them
# in the runtime directory of the build.
#
# A platform ships only while "enabled" is true. Enable a platform in the same
# change that shows its native check passing on a runner of that platform;
# until then it stays listed and disabled. The release workflow fails closed
# when no platform is enabled, and it never builds a platform that is not
# enabled here.
#
# runner:       the GitHub runner label that builds and checks the platform
#               natively. Required for an enabled platform.
# native_check: "executable-start": the packaged executable is extracted on
#               the native runner and started. Required for an enabled platform.
# runtime:      files besides the executable that the platform needs at run
#               time, relative to the package root. They are taken from the
#               runtime directory of the build and must exist.
schema: 1
addon: sandbox
executable: sandbox
manifest: addons/sandbox/manifest.json
# The directory whose content is laid at the package root (ui/sandbox.js ...).
ui: addons/sandbox/ui/dist
skills: addons/sandbox/skills
platforms:
  - platform: linux/amd64
    enabled: true
    runner: ubuntu-24.04
    native_check: executable-start
    runtime:
      - runsc
      - gvisor-profile
      - cloud-hypervisor
      - virtiofsd
      - gvisor-bin/checkpointgofer
      - gvisor-bin/gvisor-sentry-prewarmer
      - gvisor-bin/gvisor_sentry
      - gvisor-bin/runsc-fd-parking
      - gvisor-bin/runsc-metric-server
  - platform: linux/arm64
    enabled: true
    runner: ubuntu-24.04-arm
    native_check: executable-start
    runtime:
      - runsc
      - gvisor-profile
      - cloud-hypervisor
      - gvisor-bin/checkpointgofer
      - gvisor-bin/gvisor-sentry-prewarmer
      - gvisor-bin/gvisor_sentry
      - gvisor-bin/runsc-fd-parking
      - gvisor-bin/runsc-metric-server
  - platform: darwin/arm64
    enabled: true
    runner: macos-15
    native_check: executable-start
  - platform: darwin/amd64
    enabled: false
    runner: macos-15-intel
    native_check: executable-start
  - platform: windows/amd64
    enabled: false
    runner: windows-2025
    native_check: executable-start
    execution: wsl2
    runtime:
      - runsc
      - gvisor-profile
      - cloud-hypervisor
      - virtiofsd
      - gvisor-bin/checkpointgofer
      - gvisor-bin/gvisor-sentry-prewarmer
      - gvisor-bin/gvisor_sentry
      - gvisor-bin/runsc-fd-parking
      - gvisor-bin/runsc-metric-server
