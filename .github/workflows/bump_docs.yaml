name: Bump Documentation
on:
  schedule:
    - cron: 0 20 * * *
  workflow_dispatch:
jobs:
  bump-docs:
    if: github.repository == 'mudler/LocalAI'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: "mudler/LocalAI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bump dependencies 🔧
        env:
          # Authenticated API calls get 1000 req/hour instead of the 60/hour
          # anonymous cap that is shared across every job on the runner's IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/bump_docs.sh ${{ matrix.repository }}
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.UPDATE_BOT_APP_ID }}
          private-key: ${{ secrets.UPDATE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: ':arrow_up: Update docs version ${{ matrix.repository }}'
          title: 'docs: :arrow_up: update docs version ${{ matrix.repository }}'
          branch: "update/docs"
          body: Bump of ${{ matrix.repository }} version inside docs
          signoff: true



