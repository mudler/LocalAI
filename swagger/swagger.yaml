  /api/library/sources:
    get:
      description: 'Every library source of the add-on, backend and model kinds, with
        its state: kind, id, name, url, enabled (what the host does with it), default
        (shipped), removed (a default the user removed; a tombstone), suspended (a
        default while the official libraries are off), the conflict message when it
        clashes with another source, and the last fetch state when there is one. Administrators
        only.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/localai.LibrarySourcesResponse'
        "503":
          description: 'on a frontend: the add-on owner is not reachable, does not
            serve library calls, or runs on another platform; the message says which'
          schema:
            $ref: '#/definitions/schema.ErrorResponse'
      summary: List the library sources
      tags:
      - library
    post:
      consumes:
      - application/json
      description: Adds a source of your own. kind is addon, backend or model; format
        is library (default) or gallery. The id is derived from the name or URL when
        it is empty. A source with the same kind and URL is refused (409), as is a
        taken id. Administrators only.
      produces:
      - application/json
      responses:
        "201":
          description: Created
