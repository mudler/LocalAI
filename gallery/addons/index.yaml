      "fr": "Réduisez un modèle à un fichier quantifié plus petit, puis importez-le pour pouvoir discuter avec lui."
      "id": "Perkecil model menjadi berkas terkuantisasi yang lebih kecil, lalu impor agar Anda dapat mengobrol dengannya."
      "it": "Riduci un modello in un file quantizzato più piccolo, poi importalo per poterci chattare."
