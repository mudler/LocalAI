- name: vits-streaming-assistant
  urls:
    - https://localai.io/features/openai-realtime/
  description: |
    English voice assistant preset: Silero VAD, Parakeet TDT 0.6B v3, Qwen3
    0.6B chat, and VITS-LJS English single-speaker TTS through sherpa-onnx.
    Buffers streamed LLM output into clauses and emits audio progressively.
    Each clause starts a separate synthesis; this is not native incremental
    text input. This installs only the pipeline configuration. First install
    silero-vad-ggml, parakeet-cpp-tdt-0.6b-v3, qwen3-0.6b, and vits-ljs-sherpa.
    WebRTC also needs the opus backend. No browser or hardware performance
    is established by this preset.
  license: mit
  tags:
    - voice-assistant
    - audio-pipeline
    - realtime
    - streaming
    - english
    - sherpa-onnx
  config_file:
    pipeline:
        vad: silero-vad-ggml
        transcription: parakeet-cpp-tdt-0.6b-v3
        llm: qwen3-0.6b
        tts: vits-ljs-sherpa
        disable_thinking: true
        streaming:
            llm: true
            tts: true
            clause_chunking: true
