name: Diagnostic frontend artifact

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character source commit to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diagnostic-frontend-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifact:
    if: github.ref == 'refs/heads/diag/dispatch-ci' && inputs.expected_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      CGO_ENABLED: '1'
      GO_TAGS: auth
      TERM: xterm
    steps:
      - name: Check dispatch identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/diag/dispatch-ci ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
      - name: Checkout exact source
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Measure runner resources
        run: bash scripts/diagnostic-frontend-artifact.sh preflight
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install native frontend prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee artifact/apt-update.log
          sudo apt-get install -y build-essential pkg-config curl unzip git libopus-dev ffmpeg 2>&1 | tee artifact/apt-install.log
      - name: Build native frontend and mock fixture
        id: build
        run: bash scripts/diagnostic-frontend-artifact.sh build
      - name: Run frontend race gate
        id: gate
        run: bash scripts/diagnostic-frontend-artifact.sh test
      - name: Record artifact provenance and status
        if: always() && steps.checkout.outcome == 'success'
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: bash scripts/diagnostic-frontend-artifact.sh finalize
      - name: Upload diagnostic artifact and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostic-frontend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
