# SPDX-License-Identifier: MIT
name: Select affected validation
description: Conservative local-git dependency selection, with reasons
outputs:
  core:
    description: Selected core
    value: ${{ steps.select.outputs.core }}
  cpp:
    description: Selected cpp
    value: ${{ steps.select.outputs.cpp }}
  ui:
    description: Selected ui
    value: ${{ steps.select.outputs.ui }}
  addons:
    description: Selected addons
    value: ${{ steps.select.outputs.addons }}
  distributed:
    description: Selected distributed
    value: ${{ steps.select.outputs.distributed }}
  backend:
    description: Selected backend
    value: ${{ steps.select.outputs.backend }}
  build:
    description: Selected build
    value: ${{ steps.select.outputs.build }}
  packages:
    description: Selected packages
    value: ${{ steps.select.outputs.packages }}
  addons-json:
    description: Selected addons-json
    value: ${{ steps.select.outputs.addons-json }}
  addons-list:
    description: Selected addons-list
    value: ${{ steps.select.outputs.addons-list }}
  sandbox:
    description: Selected sandbox
    value: ${{ steps.select.outputs.sandbox }}
runs:
  using: composite
  steps:
    - id: select
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../scripts/ci/select.mjs"
