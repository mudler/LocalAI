# Single source of truth for the fork's `develop` branch.
#
#   develop = upstream/<upstream> + each PR branch below (in order) + the develop-ci overlay
#
# scripts/fork/rebuild-develop.sh reads this file. Keep the order: later branches
# may depend on earlier ones. A branch already reachable from upstream is skipped
# automatically; set `upstream_pr` so status.sh can report its state.
upstream:
  remote: upstream
  branch: master

overlay: develop-ci

# Each entry: name = local branch to merge (or origin/<name> if no local branch).
branches:
  - name: feat/otlp-trace-export-rebase
    description: "OTLP request and inference tracing, plus tool-schema fixes."
    upstream_pr: 13270
  - name: fix/addon-refresh-error-cause
    description: "Name the cause when an add-on library refresh fails."
    upstream_pr: 13439
  - name: feat/chat-message-timestamps
    description: "Show when each chat message was written."
    upstream_pr: null
  - name: fix/addon-library-sources
    description: "Show only add-on libraries in Find add-ons; clear a stale source filter."
    upstream_pr: null
