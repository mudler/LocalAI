          schema:
            $ref: '#/definitions/schema.SystemOneResponse'
      summary: Answer structured-extraction questions over state text.
      tags:
      - systemone
  /v1/systemone/permute:
    post:
      description: Re-runs one choice question under n_perm option orders. Reports
