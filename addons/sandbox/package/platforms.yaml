# Release platform matrix of the Sandbox add-on package.
#
# The sandbox runs code in gVisor or in a Cloud Hypervisor guest, and both are
# Linux only, so the macOS platforms are listed and stay disabled. The Linux
# packages carry the runsc of package/runsc.json, the gvisor-profile tool, and
# the Cloud Hypervisor and virtiofsd of package/kvm.json (virtiofsd on amd64
# only: upstream publishes no static arm64 build). fetch-runtime.sh puts them
# in the runtime directory of the build.
#
# A platform ships only while "enabled" is true. Enable a platform in the same
# change that shows its native check passing on a runner of that platform;
# until then it stays listed and disabled. The release workflow fails closed
# when no platform is enabled, and it never builds a platform that is not
# enabled here.
#
# runner:       the GitHub runner label that builds and checks the platform
#               natively. Required for an enabled platform.
# native_check: "executable-start": the packaged executable is extracted on
#               the native runner and started. Required for an enabled platform.
# runtime:      files besides the executable that the platform needs at run
#               time, relative to the package root. They are taken from the
#               runtime directory of the build and must exist.
schema: 1
addon: sandbox
executable: sandbox
manifest: addons/sandbox/manifest.json
# The directory whose content is laid at the package root (ui/sandbox.js ...).
ui: addons/sandbox/ui/dist
platforms:
  - platform: linux/amd64
    enabled: true
    runner: ubuntu-24.04
    native_check: executable-start
    runtime:
      - runsc
      - gvisor-profile
      - cloud-hypervisor
      - virtiofsd
      - gvisor-bin/checkpointgofer
      - gvisor-bin/gvisor-sentry-prewarmer
      - gvisor-bin/gvisor_sentry
      - gvisor-bin/runsc-fd-parking
      - gvisor-bin/runsc-metric-server
  - platform: linux/arm64
    enabled: true
    runner: ubuntu-24.04-arm
    native_check: executable-start
    runtime:
      - runsc
      - gvisor-profile
      - cloud-hypervisor
      - gvisor-bin/checkpointgofer
      - gvisor-bin/gvisor-sentry-prewarmer
      - gvisor-bin/gvisor_sentry
      - gvisor-bin/runsc-fd-parking
      - gvisor-bin/runsc-metric-server
  - platform: darwin/arm64
    enabled: false
    runner: macos-15
    native_check: executable-start
  - platform: darwin/amd64
    enabled: false
    runner: macos-15-intel
    native_check: executable-start
