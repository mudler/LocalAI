# Concurrency policy: a newer push to master cancels the in-flight run of this
# workflow on master, because the newer commit contains the older one and the
# result that matters is the newest. PR runs group by PR number (as before),
# tag pushes group by their own tag ref, and schedule/dispatch runs group by
# commit SHA, so none of those is ever cancelled by a master push.
# See .agents/ci-caching.md, section "Concurrency".
name: Build test

on:
  pull_request:
    paths:
      - 'core/**'
      - 'pkg/**'
      - 'cmd/**'
      - 'internal/**'
      - 'tests/**'
      - 'backend/*.proto'
      - 'backend/*/*.proto'
      - 'addons/**'
      - 'configuration/**'
      - 'swagger/**'
      - 'prompt-templates/**'
      - '.goreleaser*'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/workflows/build-test.yaml'
      - 'Entitlements.plist'
  push:
    branches: [master]
    paths:
      - 'core/**'
      - 'pkg/**'
      - 'cmd/**'
      - 'internal/**'
      - 'tests/**'
      - 'backend/*.proto'
      - 'backend/*/*.proto'
      - 'addons/**'
      - 'configuration/**'
      - 'swagger/**'
      - 'prompt-templates/**'
      - '.goreleaser*'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/workflows/build-test.yaml'
      - 'Entitlements.plist'

concurrency:
  group: ci-build-test-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.sha }}-${{ github.repository }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Free disk space
        # The three-platform build and the UI build fill the hosted runner and
        # fail with "no space left on device". Remove the unused preinstalled
        # toolchains before Go is installed.
        run: sh scripts/ci/free-runner-disk.sh
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
      # A PR builds only the host target. The three-platform cross-compile
      # (linux/amd64, linux/arm64, darwin/arm64) is the bulk of this job's
      # ~6.6min median and no PR consumes the resulting binaries. The
      # before-hooks (protogen-go, react-ui, go mod tidy) run either way, so the
      # "is the release build broken" signal is unchanged. master and tags still
      # build everything.
      - name: Run GoReleaser
        run: |
          make ${{ github.event_name == 'pull_request' && 'dev-dist-single' || 'dev-dist' }}
  # Cheap compile and vet check for the Windows build, run on Linux. The
  # Windows runner jobs below are slow and queue behind other work; this
  # catches code that only compiles on Unix (syscall.Kill, Getsockname on an
  # int descriptor and similar) without them. It also compiles the test files.
  # The copylocks and lostcancel analyzers are off because they report code
  # that is the same on every OS; they are not a Windows problem.
  vet-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # protogen-go downloads protoc and the Go plugins by itself. The React
      # UI is embedded at build time, so an empty dist folder is enough to
      # type-check the server without running the UI build.
      - name: Generate protobuf code
        run: |
          make protogen-go
          mkdir -p core/http/react-ui/dist
          touch core/http/react-ui/dist/index.html
      - name: Vet for windows/amd64
        env:
          GOOS: windows
          CGO_ENABLED: '0'
        run: go vet -copylocks=false -lostcancel=false ./pkg/... ./core/... ./tests/... ./cmd/...
  # Windows ships no GNU toolchain on the default runner: make is not
  # installed there and Git for Windows does not ship it (it bundles sh, uname,
  # unzip, grep, awk, sed only), so it is installed via Chocolatey below. The
  # Makefile finds Git for Windows' sh itself and runs recipes through it (see
  # the SHELL setup at the top of the Makefile), so the explicit usr/bin PATH
  # step below is belt-and-suspenders for environments where make must locate
  # sh before the makefile is read. The server builds with CGO_ENABLED=0, so no
  # mingw/gcc is needed; the Makefile downloads protoc and installs the Go
  # protobuf plugins itself (see the protoc/protogen-go targets).
  build-test-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27
      - name: Add Git usr/bin to PATH
        run: |
          echo "$env:ProgramFiles\Git\usr\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install GNU Make
        run: choco install make -y
      # App-only check: `make build` produces just the local-ai binary on
      # every platform (the llama.cpp backend is built by its own targets).
      - name: Build LocalAI (CGO disabled, mirrors release config)
        env:
          CGO_ENABLED: '0'
        run: make build
