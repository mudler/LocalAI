<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add-on proposal flow model</title>
<style>
:root{--pf-bg:#fbfaf7;--pf-fg:#1d1c1a;--pf-mute:#6b6862;--pf-line:#dcd8cf;--pf-card:#fff;--pf-acc:#1f5f8b;--pf-ok:#2b7a3d;--pf-bad:#b3261e;--pf-warn:#8a5a00;--pf-hi:#e8f1f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pf-bg:#161614;--pf-fg:#ecebe6;--pf-mute:#a09d95;--pf-line:#34332f;--pf-card:#1e1e1b;--pf-acc:#7cb7e0;--pf-ok:#7fd08f;--pf-bad:#f2958e;--pf-warn:#e0b25a;--pf-hi:#22313c}}
body{margin:0;background:var(--pf-bg);color:var(--pf-fg);font:15px/1.5 system-ui,sans-serif}
.pf-wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.pf-sub{color:var(--pf-mute);margin:0 0 12px}
.pf-grid{display:grid;grid-template-columns:260px 1fr;gap:16px}
@media (max-width:760px){.pf-grid{grid-template-columns:1fr}}
.pf-list{list-style:none;margin:0;padding:0;border:1px solid var(--pf-line);border-radius:8px;background:var(--pf-card);max-height:70vh;overflow:auto}
.pf-list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--pf-line);background:none;color:inherit;padding:8px 10px;font:inherit;cursor:pointer}
.pf-list button[aria-current="true"]{background:var(--pf-hi);font-weight:600}
.pf-list li:last-child button{border-bottom:0}
.pf-card{border:1px solid var(--pf-line);border-radius:8px;background:var(--pf-card);padding:12px;margin-bottom:12px}
.pf-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.pf-ctl button{font:inherit;padding:4px 12px;border:1px solid var(--pf-line);border-radius:6px;background:var(--pf-card);color:inherit;cursor:pointer}
.pf-ctl button:disabled{opacity:.4;cursor:default}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--pf-line);padding:5px 6px;text-align:left;vertical-align:top}
tr.pf-cur{background:var(--pf-hi)}
tr.pf-row{cursor:pointer}
code,.pf-mono{font:12px/1.4 ui-monospace,monospace;overflow-wrap:anywhere}
td.pf-fx{white-space:nowrap}
.pf-rule{font-weight:700;color:var(--pf-acc)}
.pf-rule[data-kind="ignored"]{color:var(--pf-mute)}
.pf-rule[data-kind="violation"]{color:var(--pf-bad)}
.pf-state{font-weight:600}
.pf-why{border-left:3px solid var(--pf-acc);padding:4px 10px;margin:8px 0;background:var(--pf-hi)}
.pf-pass{color:var(--pf-ok)}.pf-fail{color:var(--pf-bad)}
.pf-tag{display:inline-block;border:1px solid var(--pf-line);border-radius:10px;padding:0 7px;margin:0 4px 2px 0;font-size:12px}
details{margin-top:8px}
</style>
</head>
<body>
<div class="pf-wrap">
<h1>Add-on proposal flow model</h1>
<p class="pf-sub">Generated by running the real reducer (<code>reduce.go</code>) over the traces. Regenerate with <code>go generate ./pkg/addons/model/proposalflow</code>.</p>
<div class="pf-card" id="pf-explore"></div>
<div class="pf-grid">
<ul class="pf-list" id="pf-traces"></ul>
<div>
<div class="pf-card">
<h2 id="pf-title" style="font-size:17px;margin:0"></h2>
<p id="pf-about" class="pf-sub" style="margin:4px 0"></p>
<div class="pf-ctl"><button id="pf-prev">Previous</button><button id="pf-next">Next</button><button id="pf-all">Show all</button><span id="pf-pos" class="pf-sub"></span></div>
<div id="pf-why" class="pf-why"></div>
<table><thead><tr><th>#</th><th>Event</th><th>Rule</th><th>Before</th><th>After</th><th>Effects</th></tr></thead><tbody id="pf-steps"></tbody></table>
<p id="pf-final" class="pf-sub"></p>
</div>
<details class="pf-card"><summary>Rule table</summary><table id="pf-rules"></table></details>
</div>
</div>
</div>
<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
let cur = 0, pos = 0, showAll = false;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function stateHtml(s){return '<span class="pf-state">'+esc(s.name)+'</span><div class="pf-mono">'+esc(s.detail)+'</div>';}
function renderExplore(){
  const e = DATA.explore, bad = e.violations.length + e.deadEnds.length;
  const names = Object.keys(e.byName).sort().map(n=>'<span class="pf-tag">'+esc(n)+' '+e.byName[n]+'</span>').join('');
  $('pf-explore').innerHTML = '<b>Invariant search</b>: '+e.states+' states, '+e.edges+' steps, '+e.terminals+' terminal states, '+
    e.deadEnds.length+' dead ends, '+e.violations.length+' violations. <span class="'+(bad?'pf-fail':'pf-pass')+'">'+(bad?'FAILED':'passed')+'</span><div>'+names+'</div>';
}
function renderList(){
  $('pf-traces').innerHTML = DATA.traces.map((t,i)=>'<li><button data-i="'+i+'" '+(i===cur?'aria-current="true"':'')+'>'+esc(t.name)+' <span class="'+(t.ok?'pf-pass':'pf-fail')+'">'+(t.ok?'ok':'FAIL')+'</span></button></li>').join('');
  $('pf-traces').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;pos=0;showAll=false;render();});
}
function render(){
  renderList();
  const t = DATA.traces[cur];
  $('pf-title').textContent = t.name;
  $('pf-about').textContent = t.about;
  const upto = showAll ? t.steps.length : pos + 1;
  $('pf-steps').innerHTML = t.steps.slice(0, upto).map((s,i)=>
    '<tr class="pf-row '+(i===pos&&!showAll?'pf-cur':'')+'" data-i="'+i+'"><td>'+(i+1)+'</td><td class="pf-mono">'+esc(s.event)+'</td><td><span class="pf-rule" data-kind="'+esc(s.ruleKind)+'">'+esc(s.rule)+'</span></td><td>'+stateHtml(s.before)+'</td><td>'+stateHtml(s.after)+'</td><td class="pf-mono pf-fx">'+(s.effects.length?s.effects.map(esc).join('<br>'):'none')+'</td></tr>').join('');
  $('pf-steps').querySelectorAll('tr').forEach(r=>r.onclick=()=>{pos=+r.dataset.i;showAll=false;render();});
  const s = t.steps[pos];
  $('pf-why').innerHTML = 'Step '+(pos+1)+' of '+t.steps.length+' went to <b>'+esc(s.after.name)+'</b>. Rule <b>'+esc(s.rule)+'</b> ('+esc(s.ruleKind)+'): '+esc(s.ruleText)+'. Event: <code>'+esc(s.event)+'</code>.';
  $('pf-pos').textContent = (pos+1)+' / '+t.steps.length;
  $('pf-prev').disabled = pos===0; $('pf-next').disabled = pos===t.steps.length-1;
  $('pf-final').innerHTML = 'Expected final state: <b>'+esc(t.final.name)+'</b> <span class="pf-mono">'+esc(t.final.detail)+'</span>. '+(t.ok?'<span class="pf-pass">The reducer matches the expected rules, effects and final state.</span>':'<span class="pf-fail">'+t.bad.map(esc).join('; ')+'</span>');
}
$('pf-prev').onclick=()=>{if(pos>0){pos--;showAll=false;render();}};
$('pf-next').onclick=()=>{const t=DATA.traces[cur];if(pos<t.steps.length-1){pos++;showAll=false;render();}};
$('pf-all').onclick=()=>{showAll=!showAll;render();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('pf-next').click();if(e.key==='ArrowLeft')$('pf-prev').click();});
$('pf-rules').innerHTML = '<tr><th>Id</th><th>Kind</th><th>Meaning</th></tr>'+DATA.rules.map(r=>'<tr><td><span class="pf-rule" data-kind="'+esc(r.kind)+'">'+esc(r.id)+'</span></td><td>'+esc(r.kind)+'</td><td>'+esc(r.text)+'</td></tr>').join('');
renderExplore(); render();
</script>
</body>
</html>
