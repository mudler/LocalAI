  /api/models/{id}/load-cancel:
    post:
      consumes:
      - application/json
      description: Cancels the load attempt named by `job_id` and stops its remote
        work. 200 means the attempt is gone or the worker confirmed the stop. 202
        means the cancel is recorded and the stop is pending; the model is released
        after `retry_after` seconds regardless. 409 means a different attempt is current
        and carries its `current_job_id`. Repeating the call is safe and does not
        extend the hold.
      parameters:
      - description: Model ID
        in: path
        name: id
        required: true
        type: string
      - description: The exact attempt to cancel
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.ModelLoadCancelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Stopped, or no such load any more
          schema:
            $ref: '#/definitions/schema.ModelLoadCancelResponse'
        "202":
          description: Cancel recorded; stop pending
          schema:
            $ref: '#/definitions/schema.ModelLoadCancelResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/schema.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/schema.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/schema.ErrorResponse'
        "404":
          description: Unknown model
          schema:
            $ref: '#/definitions/schema.ErrorResponse'
        "409":
          description: A different attempt is current
          schema:
            $ref: '#/definitions/schema.ModelLoadCancelResponse'
      summary: Cancel one distributed model load.
      tags:
      - models
  /api/models/{id}/load-status:
    get:
      description: 'Returns the live state of a distributed cold load: job id, phase,
        node, byte progress, ETA, lease freshness, and for a failed attempt the cause,
        whether the stop is pending and when the model is released. 404 means no load
        exists for the model. A database error is 503, never an empty answer. This
        is the same `loading` object the 503 response carries while a model is still
        staging.'
      parameters:
      - description: Model ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Live load progress
