# Official add-on library: the first-party add-ons, one entry for each
# enabled platform of each package. LocalAI registers this file as its default
# library (the raw URL of this file on the master branch). The file is
# generated, never edited by hand:
#   sh scripts/addons/catalog.sh --channel development --repository <repo> --out gallery/addons/index.yaml
# CI fails when the committed file differs from the generated one.
# Every entry is a development entry: it is mutable, keeps the moving tag
# <id>-development and has no digest. The install resolves the tag to a digest,
# verifies the signature against it and records it, as for a development
# backend. A tagged release does not read this file for its pins: the release
# workflow renders pinned entries into the asset addons-index.yaml of the
# release (see .agents/preparing-a-release.md).
- id: "discord"
  name: Discord
  description: "Bind a Discord bot to one of your saved agents, so people can talk to it from Discord."
  version: "0.0.0-development"
  channel: "development"
  artifact: "oci://quay.io/go-skynet/local-ai-addons:discord-development"
  mutable: true
  os: "darwin"
  arch: "amd64"
  policy:
    requireSignature: true
    issuer: "https://token.actions.githubusercontent.com"
    identity: "https://github.com/mudler/LocalAI/.github/workflows/addons-package.yml@refs/heads/master"
  ui:
    title: "Discord"
    description: "Bind a Discord bot to one of your saved agents, so people can talk to it from Discord."
    mainPage: "bots"
    icon: "ui/icon.png"
    titles:
      "de": "Discord"
      "es": "Discord"
      "fr": "Discord"
      "id": "Discord"
      "it": "Discord"
      "ko": "Discord"
      "pt-BR": "Discord"
      "zh-CN": "Discord"
    descriptions:
      "de": "Verbinden Sie einen Discord-Bot mit einem Ihrer gespeicherten Agenten, damit andere über Discord mit ihm sprechen können."
      "es": "Vincula un bot de Discord a uno de tus agentes guardados para que la gente pueda hablar con él desde Discord."
      "fr": "Associez un bot Discord à l'un de vos agents enregistrés pour que les gens puissent lui parler depuis Discord."
      "id": "Hubungkan bot Discord ke salah satu agen tersimpan Anda agar orang dapat mengobrol dengannya dari Discord."
      "it": "Collega un bot Discord a uno dei tuoi agenti salvati, così le persone possono parlarci da Discord."
      "ko": "저장한 에이전트 중 하나에 Discord 봇을 연결하여 사람들이 Discord에서 대화할 수 있게 합니다."
      "pt-BR": "Vincule um bot do Discord a um dos seus agentes salvos para que as pessoas possam conversar com ele pelo Discord."
      "zh-CN": "将 Discord 机器人绑定到你保存的某个智能体，让大家可以在 Discord 中与它对话。"
