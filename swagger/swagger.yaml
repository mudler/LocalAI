      - description: request + question + n_perm + seed
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schema.SystemOnePermuteRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schema.SystemOnePermuteResponse'
      summary: Re-run a choice question under multiple option orders.
      tags:
      - systemone
  /v1/systemone/separate:
    post:
      description: Runs N independent NER passes, one per question, against the same
        state. Response shape matches /v1/systemone.
      parameters:
      - description: state + questions
        in: body
        name: request
        required: true
        schema:
