{{- $home := .Site.Home.RelPermalink -}}
{{- $p := .RelPermalink -}}
<header class="top">
  <div class="shell">
    <a class="brand" href="{{ $home }}"><img src="{{ "img/brand/mark-color.svg" | relURL }}" alt="" width="40" height="40"><span>LocalAI</span></a>
    <nav class="nav" aria-label="Main">
      <a href="{{ "features/" | relURL }}"{{ if hasPrefix $p "/features/" }}{{ if not (in $p "addons") }}{{ if not (in $p "models") }} aria-current="page"{{ end }}{{ end }}{{ end }}>Features</a>
      <a href="{{ "features/addons/" | relURL }}"{{ if in $p "/features/addons" }} aria-current="page"{{ end }}>Add-ons</a>
      <a href="{{ "features/models/" | relURL }}"{{ if in $p "/features/models" }} aria-current="page"{{ end }}>Models</a>
      <a href="{{ "get-started/" | relURL }}"{{ if in $p "/get-started" }} aria-current="page"{{ end }}>Get started</a>
      <a href="{{ .Site.Params.docsURL }}">Docs</a>
      <a href="{{ "blog/" | relURL }}">Blog</a>
    </nav>
    <div class="topright">
      <a class="pill" href="{{ .Site.Params.github }}" aria-label="LocalAI on GitHub, {{ lang.FormatNumberCustom 0 .Site.Data.stats.stars }} stars">&#9733; {{ lang.FormatNumberCustom 0 .Site.Data.stats.stars }}</a>
      <button class="iconbtn" id="theme" type="button" aria-label="Switch between light and dark theme">
        <svg class="moon-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="btn" href="{{ "download/" | relURL }}">Download</a>
    </div>
  </div>
</header>
