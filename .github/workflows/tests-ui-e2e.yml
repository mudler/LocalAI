---
name: 'UI E2E Tests'

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 1'

concurrency:
  group: ci-tests-ui-e2e-${{ github.event.pull_request.number || github.sha }}-${{ github.repository }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests-ui-e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x']
    steps:
      - name: Clone
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Select affected validation
        id: affected
        uses: ./.github/actions/ci-select
      - name: Explain omitted work
        if: steps.affected.outputs.ui == 'false'
        run: echo 'No affected dependencies; see selector reasons above.'
      - name: Configure apt mirror on runner
        id: work4
        if: steps.affected.outputs.ui == 'true'
        uses: ./.github/actions/configure-apt-mirror
      - name: Setup Go ${{ matrix.go-version }}
        id: work5
        if: steps.affected.outputs.ui == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Setup Node.js
        id: work6
        if: steps.affected.outputs.ui == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Setup Bun
        id: work7
        if: steps.affected.outputs.ui == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Proto Dependencies
        id: work8
        if: steps.affected.outputs.ui == 'true'
        run: |
          curl -L -s https://github.com/protocolbuffers/protobuf/releases/download/v26.1/protoc-26.1-linux-x86_64.zip -o protoc.zip && \
          unzip -j -d /usr/local/bin protoc.zip bin/protoc && \
          rm protoc.zip
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@1958fcbe2ca8bd93af633f11e97d44e567e945af
      - name: System Dependencies
        id: work9
        if: steps.affected.outputs.ui == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopus-dev
      # Runs the specs tagged @production-chunks on the production bundle the
      # binary embeds (code-split, CSS per chunk): the stale chunk recovery
      # specs and the production bundle walk of the main pages. The coverage
      # run below uses a different bundle and skips them.
      - name: Run production bundle tests
        id: work10
        if: steps.affected.outputs.ui == 'true'
        run: PATH="$PATH:$HOME/go/bin" make test-ui-stale-chunk
      # Builds an instrumented UI bundle, runs the Playwright specs, and fails
      # if line coverage regressed beyond the jitter tolerance (the gate is
      # in `make test-ui-coverage-check`). PLAYWRIGHT_CHROMIUM_PATH is unset
      # here, so scripts/ensure-playwright-browser.sh installs Chromium via apt.
      - name: Run UI e2e + coverage gate
        id: work11
        if: steps.affected.outputs.ui == 'true'
        run: PATH="$PATH:$HOME/go/bin" make test-ui-coverage-check
      - name: Upload Playwright report
        if: ${{ (failure()) && steps.affected.outputs.ui == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: core/http/react-ui/playwright-report/
          retention-days: 7
      - name: Upload UI coverage report
        if: ${{ (always()) && steps.affected.outputs.ui == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-coverage
          path: core/http/react-ui/coverage/
          if-no-files-found: ignore
          retention-days: 7
      # tmate keeps the runner busy until the 6 hour job limit, so a single
      # failure costs a whole runner slot. Only open a session when someone
      # asked for one by labelling the pull request `ci-debug`, and cap the
      # session so a forgotten label cannot idle a runner either.
      - name: Setup tmate session if tests fail
        if: ${{ (failure() && contains(github.event.pull_request.labels.*.name, 'ci-debug')) && steps.affected.outputs.ui == 'true' }}
        timeout-minutes: 30
        uses: mxschmitt/action-tmate@v3.23
        with:
          detached: true
          connect-timeout-seconds: 180
          limit-access-to-actor: true
      - name: Require selected work to succeed
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          DOMAIN: ui
          REQUIRED: work4 work5 work6 work7 work8 work9 work10 work11
        run: node scripts/ci/check-steps.mjs
