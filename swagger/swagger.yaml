  gateway.CreateResourceRequest:
    properties:
      addonId:
        description: AddonID names the add-on whose resource is created.
        example: tables
        type: string
      arguments:
        description: |-
          Arguments are the create arguments the add-on's create tool takes, for
          example the name. They are validated against its tool definition.
        type: object
      generation:
        description: Generation is the installed generation the caller listed.
        example: 3
        type: integer
      operationId:
        description: |-
          OperationID names the creation. Repeating it never creates a second
          resource and, after an outcome_unknown answer, it is what to repeat.
        example: create-budget-1
        type: string
    type: object
  gateway.DeleteResourceRequest:
    properties:
      confirm:
        description: |-
          Confirm must equal the display name of the resource exactly: the person
          types it to confirm. Deletion removes the data and every grant, cannot
          be undone and is never a chat operation.
        example: Budget
        type: string
      generation:
        example: 3
        type: integer
      operationId:
        example: delete-1
        type: string
      revision:
        $ref: '#/definitions/contract.Revision'
    type: object
  gateway.DeleteResult:
    properties:
      deleted:
        description: |-
          Deleted is true once the add-on confirmed that the data is gone and
          the grants were removed.
        type: boolean
      resourceId:
        type: string
    type: object
  gateway.Grant:
    properties:
      displayName:
        example: Bob
        type: string
      role:
        enum:
        - viewer
        - editor
        example: viewer
        type: string
      userId:
