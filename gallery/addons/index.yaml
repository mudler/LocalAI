  artifact: "oci://quay.io/go-skynet/local-ai-addons:voice-development"
  mutable: true
  os: "darwin"
  arch: "amd64"
  policy:
    requireSignature: true
    issuer: "https://token.actions.githubusercontent.com"
    identity: "https://github.com/mudler/LocalAI/.github/workflows/addons-package.yml@refs/heads/master"
  ui:
    title: "Voice"
    description: "Recognise who is speaking, keep the voices that text-to-speech can use, and speak text with them."
    mainPage: "voice"
    icon: "ui/icon.png"
    titles:
      "de": "Stimme"
      "es": "Voz"
      "fr": "Voix"
      "id": "Suara"
      "it": "Voce"
      "ko": "음성"
      "pt-BR": "Voz"
      "zh-CN": "声音"
    descriptions:
      "de": "Erkennen Sie, wer spricht, verwalten Sie die Stimmen, die die Sprachausgabe verwenden kann, und sprechen Sie Text mit ihnen."
      "es": "Reconoce quién está hablando, guarda las voces que puede usar la síntesis de voz y di textos con ellas."
      "fr": "Reconnaissez qui parle, gardez les voix que la synthèse vocale peut utiliser et prononcez du texte avec elles."
      "id": "Kenali siapa yang berbicara, simpan suara yang dapat digunakan text-to-speech, dan ucapkan teks dengan suara tersebut."
      "it": "Riconosci chi sta parlando, conserva le voci che la sintesi vocale può usare e leggi testi con quelle voci."
      "ko": "말하는 사람을 인식하고, 음성 합성에서 사용할 수 있는 목소리를 보관하며, 그 목소리로 텍스트를 읽습니다."
      "pt-BR": "Reconheça quem está falando, guarde as vozes que a síntese de fala pode usar e fale textos com elas."
      "zh-CN": "识别说话的人，管理语音合成可用的声音，并用这些声音朗读文本。"
