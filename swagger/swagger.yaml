      - application/json
      description: JSON accepts model, file (raw base64 audio), include_text, include_speaker_profiles,
        include_sounds and response_format. Profiles require voice-recognition permission
        and json or verbose_json; unsupported backends return 501.
      parameters:
      - description: model
        in: formData
        name: model
        required: true
        type: string
      - description: audio file
        in: formData
        name: file
        required: true
        type: file
      - description: exact speaker count (>0 forces; 0 = auto)
        in: formData
        name: num_speakers
        type: integer
      - description: lower bound when auto-detecting
        in: formData
        name: min_speakers
        type: integer
      - description: upper bound when auto-detecting
        in: formData
        name: max_speakers
        type: integer
      - description: clustering distance threshold when num_speakers is unknown
        in: formData
        name: clustering_threshold
        type: number
      - description: discard segments shorter than this (seconds)
        in: formData
        name: min_duration_on
        type: number
      - description: merge gaps shorter than this (seconds)
        in: formData
        name: min_duration_off
        type: number
      - description: audio language hint (only meaningful for backends that bundle
          ASR)
        in: formData
        name: language
        type: string
      - description: export portable biometric profiles (voice-recognition permission;
          JSON formats only)
        in: formData
        name: include_speaker_profiles
        type: boolean
      - description: include per-segment transcript when the backend supports it
        in: formData
        name: include_text
        type: boolean
      - description: include closed sound events (start, end, label, confidence) when
          the model has a sound_model companion; otherwise 501 include_sounds_unsupported
          (JSON formats only)
        in: formData
        name: include_sounds
        type: boolean
