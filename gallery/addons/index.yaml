- id: "talk"
  name: Talk
  description: "Have a spoken conversation with a model: your voice goes in, the answer is spoken back."
  version: "0.0.0-development"
  channel: "development"
  artifact: "oci://quay.io/go-skynet/local-ai-addons:talk-development"
  mutable: true
  os: "darwin"
  arch: "amd64"
  policy:
    requireSignature: true
    issuer: "https://token.actions.githubusercontent.com"
    identity: "https://github.com/mudler/LocalAI/.github/workflows/addons-package.yml@refs/heads/master"
  ui:
    title: "Talk"
    description: "Have a spoken conversation with a model: your voice goes in, the answer is spoken back."
    mainPage: "talk"
    icon: "ui/icon.png"
    titles:
      "de": "Sprachchat"
      "es": "Conversación de voz"
      "fr": "Vocal"
      "id": "Obrolan suara"
      "it": "Conversazione vocale"
      "ko": "음성 대화"
      "pt-BR": "Conversa por voz"
      "zh-CN": "语音对话"
    descriptions:
      "de": "Führen Sie ein gesprochenes Gespräch mit einem Modell: Ihre Stimme geht hinein, die Antwort wird gesprochen."
      "es": "Mantén una conversación hablada con un modelo: tu voz entra y la respuesta se pronuncia en voz alta."
      "fr": "Dialoguez à voix haute avec un modèle : votre voix entre, la réponse est prononcée."
      "id": "Lakukan percakapan lisan dengan model: suara Anda masuk, jawabannya diucapkan kembali."
      "it": "Conversa a voce con un modello: la tua voce entra, la risposta viene pronunciata."
      "ko": "모델과 음성으로 대화합니다. 내 목소리가 입력되고 답변은 음성으로 들려줍니다."
      "pt-BR": "Tenha uma conversa falada com um modelo: sua voz entra e a resposta é falada de volta."
      "zh-CN": "与模型进行语音对话：你说话输入，回答以语音读出。"
