- url: github:mudler/LocalAI/gallery/virtual.yaml@master
  name: wemm-embedding-2b
  description: |
    WeMM-Embedding-2B is Tencent's Apache-2.0 multilingual embedding model
    built on Qwen3.5. This entry serves the original bfloat16 safetensors with
    LocalAI's Transformers backend and produces 2,048-dimensional normalized
    embeddings for text retrieval, semantic search, and RAG.

    The upstream model can also embed images and videos. LocalAI currently
    exposes text input through its embeddings API for this backend.
  license: apache-2.0
  urls:
    - https://huggingface.co/tencent/WeMM-Embedding-2B
  tags:
    - embeddings
    - safetensors
    - transformers
    - multilingual
    - retrieval
    - rag
    - gpu
    - cpu
  overrides:
    backend: transformers
    embeddings: true
    known_usecases:
      - embeddings
    parameters:
      model: tencent/WeMM-Embedding-2B
    trust_remote_code: true
    type: SentenceTransformer
  variants:
    - model: wemm-embedding-4b
    - model: wemm-embedding-9b
