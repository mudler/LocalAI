  name: PiKVM
  description: "Let your chats and agents check a PiKVM and, if you allow it, press power buttons and type on the machine it controls, asking you to confirm each time unless you say otherwise."
  version: "0.0.0-development"
  channel: "development"
  artifact: "oci://quay.io/go-skynet/local-ai-addons:pikvm-development"
  mutable: true
  os: "darwin"
