          MaxCompletionTokens is the modern alias for max_tokens
          (OpenAI deprecated max_tokens; gpt-5 / o-series reject it).
          Accepted on the wire so up-to-date clients can use the new
          name; the request middleware collapses it into Maxtokens so
          internal code reads exactly one field.
        type: integer
      max_tokens:
        type: integer
      messages:
        description: Messages is read only by chat/completion API calls
        items:
          $ref: '#/definitions/schema.Message'
        type: array
      metadata:
        additionalProperties:
          type: string
        type: object
      min_p:
        type: number
      model:
        type: string
      model_base_name:
        type: string
      "n":
        description: Also part of the OpenAI official spec. use it for returning multiple
          results
        type: integer
      n_keep:
        type: integer
      negative_prompt:
        description: |-
          NegativePrompt for image generation (matches Stable Diffusion WebUI /
          vLLM-Omni conventions). Combined, comma-separated, with any "|"-suffixed
          negative tags in Prompt.
        type: string
      negative_prompt_scale:
        type: number
      pooling:
        description: |-
          Pooling is a LocalAI extension for /v1/embeddings: how the backend's
          per-token vectors are reduced to a single embedding. "" or "backend"
          leaves pooling to the inference backend (the pre-existing behavior);
          "mean", "last" and "decayed_mean" pool Go-side from raw per-token
          vectors (the backend must run with the "pooling:none" option, which
          model configs get automatically when this is set).
        type: string
      pooling_half_life_tokens:
        description: |-
          PoolingHalfLifeTokens is a LocalAI extension for /v1/embeddings: the
          half-life (in tokens) of the "decayed_mean" pooling scheme — a token's
          weight halves every this-many positions counting back from the end of
          the conversation. Defaults to 256 when unset.
        type: integer
      presence_penalty:
        type: number
      prompt:
        description: Prompt is read only by completion/image API calls
      quality:
        description: Image (not supported by OpenAI)
        type: string
      reasoning_effort:
        type: string
      ref_images:
        description: Reference images for models that support them (e.g., Flux Kontext)
        items:
          type: string
        type: array
      repeat_last_n:
        type: integer
      repeat_penalty:
        type: number
      response_format:
        description: whisper/image
      rope_freq_base:
        type: number
      rope_freq_scale:
        type: number
      seed:
        type: integer
      size:
        description: image
        type: string
      step:
        type: integer
      stop: {}
      stream:
        type: boolean
      stream_options:
        allOf:
        - $ref: '#/definitions/schema.StreamOptions'
        description: StreamOptions opts into OpenAI streaming extensions, e.g. include_usage.
      temperature:
        type: number
      tfz:
        type: number
      tokenizer:
        description: RWKV (?)
        type: string
      tool_choice: {}
      tools:
        items:
          $ref: '#/definitions/functions.Tool'
        type: array
      top_k:
        type: integer
      top_logprobs:
        description: Number of top logprobs per token (0-20)
        type: integer
      top_p:
        description: Common options between all the API calls, part of the OpenAI
          spec
        type: number
      translate:
        description: Only for audio transcription
        type: boolean
      typical_p:
        type: number
    required:
    - file
    type: object
