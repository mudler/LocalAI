<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalAI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fff4dc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1211" media="(prefers-color-scheme: dark)" />
    <script>
      // Set the theme before first paint, with the same rule as ThemeContext:
      // a stored choice wins, a fresh install opens dark.
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('localai-theme') || 'dark')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
