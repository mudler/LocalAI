# Official add-on library: the first-party add-ons, one entry for each package.
# LocalAI registers this file as its default library (the raw URL of this file
# on the master branch). The entries are rendered by the add-on package
# workflow with `addonpkg catalog`: regenerate this file from the workflow
# output, never edit a digest by hand. A release entry is pinned by digest. A
# development entry is mutable: it keeps the moving tag <id>-development, has
# no digest, and the install resolves the tag to a digest, verifies the
# signature against it and records it, as for a development backend.
