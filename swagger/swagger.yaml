  updates.State:
    enum:
    - unknown
    - up-to-date
    - update-available
    - incompatible
    - check-failed
    - integrity-error
    type: string
    x-enum-varnames:
    - Unknown
    - UpToDate
    - UpdateAvailable
    - Incompatible
    - CheckFailed
    - IntegrityError
  updates.Status:
    properties:
      addonId:
        example: notes
        type: string
      available:
        description: Available is true only for update-available.
        type: boolean
      candidateDigest:
        type: string
      candidateVersion:
        example: 1.1.0
        type: string
      channel:
        example: development
        type: string
      checkedAt:
        description: |-
          CheckedAt is when the status was computed. LastSuccess is when the
          library was last read successfully: a failed check keeps it, so the
          page can say how old the knowledge is.
        type: string
      error:
        description: Error is the redacted class of a failed check.
        example: refresh-failed
        type: string
      generation:
        description: Generation is the installed generation the status describes.
        example: 1
        type: integer
      installedDigest:
        type: string
      installedVersion:
        example: 1.0.0
        type: string
      lastSuccess:
        type: string
      reasons:
        description: |-
          Reasons are the compatibility reasons of an incompatible or
          integrity-error status.
        items:
          type: string
        type: array
      selection:
        example: 1.0.0
        type: string
      sourceId:
        description: |-
          SourceID, Channel and Selection are the library, channel and
          selection the add-on was installed from. They never change by themselves.
        example: official
        type: string
      stale:
        description: |-
          Stale is true when the library data or the cached answer is older than
          the time to live.
        type: boolean
      state:
        allOf:
        - $ref: '#/definitions/updates.State'
        enum:
        - unknown
        - up-to-date
        - update-available
        - incompatible
        - check-failed
        - integrity-error
        example: update-available
      throttled:
        description: |-
          Throttled is true when an explicit refresh was not performed because
          one ran moments ago. The status is then the last one.
        type: boolean
    type: object
  voiceprofile.AudioMetadata:
