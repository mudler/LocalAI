---
name: 'sandbox guest image'

# Builds the guest images of the Sandbox add-on for linux/amd64 and
# linux/arm64 (addons/sandbox/images/guest/Dockerfile) and pushes them to the
# project registry, the one the other image jobs use (quay.io/go-skynet). There
# is one image for each sandbox profile: the targets base, media and video of
# the Dockerfile. The release of the add-on stamps the digests into the
# executable:
#
#   SANDBOX_GUEST_IMAGE=<repository>@sha256:<digest> \
#   SANDBOX_GUEST_IMAGE_MEDIA=<repository>@sha256:<digest> \
#   SANDBOX_GUEST_IMAGE_VIDEO=<repository>@sha256:<digest> \
#     sh scripts/addons/package.sh ...
#
# This workflow outputs these values as "image" (the base image; also the bare
# "digest"), "image_media" and "image_video", so a caller workflow can run it
# with `uses:` and pass the outputs to the package legs of the sandbox add-on.
#
# Event policy:
#   pull_request          build both architectures, push nothing, no secrets
#   push to master        build and push, tag sha-<short sha>
#   workflow_dispatch     build and push, tag sha-<short sha>
#   workflow_call         as the event of the caller: build and push, tag
#                         sha-<short sha>, except for a pull request and for a
#                         push to a branch other than master, which push nothing
#
# The repository of the base image is quay.io/go-skynet/sandbox-guest unless
# the repository variable SANDBOX_GUEST_REPOSITORY names another one. The media
# and video images go to the same repository with the tags media-sha-<sha> and
# video-sha-<sha>; the base image keeps sha-<sha>. The references by digest all
# name the one repository. The repository must allow anonymous pulls: the
# add-on pulls an image on the host that runs it.

on:
  workflow_call:
    outputs:
      image:
        description: 'Reference of the guest image by digest: <repository>@sha256:<digest>'
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: 'Digest of the guest image index'
        value: ${{ jobs.build.outputs.digest }}
      image_media:
        description: 'Reference of the media guest image by digest'
        value: ${{ jobs.build.outputs.image_media }}
      image_video:
        description: 'Reference of the video guest image by digest'
        value: ${{ jobs.build.outputs.image_video }}
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'addons/sandbox/images/guest/**'
      - '.github/workflows/sandbox-images.yml'
  pull_request:
    paths:
      - 'addons/sandbox/images/guest/**'
      - '.github/workflows/sandbox-images.yml'

permissions:
  contents: read

# The group names the workflow that runs: for a workflow_call it is the
# caller, so the run of this file and the run that add-on packages calls for
# the same pull request do not cancel each other.
concurrency:
  group: sandbox-images-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build and push the guest image
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      image_media: ${{ steps.ref.outputs.image_media }}
      image_video: ${{ steps.ref.outputs.image_video }}
    env:
      REPOSITORY: ${{ vars.SANDBOX_GUEST_REPOSITORY || 'quay.io/go-skynet/sandbox-guest' }}
      # A caller's push to a branch other than master publishes nothing
      # (scripts/addons/channel.sh), so it pushes no guest image either.
      PUSH: ${{ github.repository == 'mudler/LocalAI' && github.event_name != 'pull_request' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      # The kernel builds on the build machine and cross-compiles. Only the
      # userland stage of the arm64 image needs emulation.
      - uses: docker/setup-qemu-action@master
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@master
      - name: Registry login
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.LOCALAI_REGISTRY_USERNAME }}
          password: ${{ secrets.LOCALAI_REGISTRY_PASSWORD }}
      # Each target is one build. The kernel and the agent stages are shared,
      # so the layer cache makes the second and third build short for them.
      - name: Build base
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./addons/sandbox/images/guest/Dockerfile
          target: base
          platforms: linux/amd64,linux/arm64
          # No attestation manifests: the add-on reads the index and picks the
          # manifest of its own architecture.
          provenance: false
          sbom: false
          cache-from: type=registry,ref=quay.io/go-skynet/ci-cache:cache-sandbox-guest
          cache-to: ${{ env.PUSH == 'true' && 'type=registry,ref=quay.io/go-skynet/ci-cache:cache-sandbox-guest,mode=max,ignore-error=true' || '' }}
          tags: ${{ env.REPOSITORY }}:sha-${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
      - name: Build media
        id: build_media
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./addons/sandbox/images/guest/Dockerfile
          target: media
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          cache-from: type=registry,ref=quay.io/go-skynet/ci-cache:cache-sandbox-guest
          cache-to: ${{ env.PUSH == 'true' && 'type=registry,ref=quay.io/go-skynet/ci-cache:cache-sandbox-guest,mode=max,ignore-error=true' || '' }}
          tags: ${{ env.REPOSITORY }}:media-sha-${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
      - name: Build video
        id: build_video
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./addons/sandbox/images/guest/Dockerfile
          target: video
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          cache-from: type=registry,ref=quay.io/go-skynet/ci-cache:cache-sandbox-guest
          cache-to: ${{ env.PUSH == 'true' && 'type=registry,ref=quay.io/go-skynet/ci-cache:cache-sandbox-guest,mode=max,ignore-error=true' || '' }}
          tags: ${{ env.REPOSITORY }}:video-sha-${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
      - name: Name the images by digest
        id: ref
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_MEDIA: ${{ steps.build_media.outputs.digest }}
          DIGEST_VIDEO: ${{ steps.build_video.outputs.digest }}
        run: |
          set -eu
          for d in "$DIGEST" "$DIGEST_MEDIA" "$DIGEST_VIDEO"; do
            case "$d" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "a build returned no image digest: '$d'" >&2; exit 1 ;;
            esac
          done
          {
            echo "image=${REPOSITORY}@${DIGEST}"
            echo "image_media=${REPOSITORY}@${DIGEST_MEDIA}"
            echo "image_video=${REPOSITORY}@${DIGEST_VIDEO}"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Sandbox guest images'
            echo
            echo "SANDBOX_GUEST_IMAGE=${REPOSITORY}@${DIGEST}"
            echo "SANDBOX_GUEST_IMAGE_MEDIA=${REPOSITORY}@${DIGEST_MEDIA}"
            echo "SANDBOX_GUEST_IMAGE_VIDEO=${REPOSITORY}@${DIGEST_VIDEO}"
          } >> "$GITHUB_STEP_SUMMARY"
