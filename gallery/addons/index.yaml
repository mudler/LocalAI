- id: "face"
  name: Face
  description: "Find out whose face is in a photo, or whether two photos show the same person."
  version: "0.0.0-development"
  channel: "development"
  artifact: "oci://quay.io/go-skynet/local-ai-addons:face-development"
  mutable: true
  os: "darwin"
  arch: "amd64"
  policy:
    requireSignature: true
    issuer: "https://token.actions.githubusercontent.com"
    identity: "https://github.com/mudler/LocalAI/.github/workflows/addons-package.yml@refs/heads/master"
  ui:
    title: "Face"
    description: "Find out whose face is in a photo, or whether two photos show the same person."
    mainPage: "recognition"
    icon: "ui/icon.png"
    titles:
      "de": "Gesicht"
      "es": "Rostro"
      "fr": "Visage"
      "id": "Wajah"
      "it": "Volto"
      "ko": "얼굴"
      "pt-BR": "Rosto"
      "zh-CN": "人脸"
    descriptions:
      "de": "Finden Sie heraus, wessen Gesicht auf einem Foto zu sehen ist oder ob zwei Fotos dieselbe Person zeigen."
      "es": "Descubre de quién es el rostro de una foto, o si dos fotos muestran a la misma persona."
      "fr": "Découvrez à qui appartient le visage sur une photo, ou si deux photos montrent la même personne."
      "id": "Cari tahu wajah siapa yang ada di sebuah foto, atau apakah dua foto menunjukkan orang yang sama."
      "it": "Scopri di chi è il volto in una foto, o se due foto mostrano la stessa persona."
      "ko": "사진 속 얼굴이 누구인지, 또는 두 사진이 같은 사람인지 확인합니다."
      "pt-BR": "Descubra de quem é o rosto em uma foto, ou se duas fotos mostram a mesma pessoa."
      "zh-CN": "找出照片中的人是谁，或判断两张照片是否是同一个人。"
